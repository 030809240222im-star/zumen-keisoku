<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#14171c">
<meta name="apple-mobile-web-app-title" content="図面計測">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<title>図面計測</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{
  --bg:#14171c; --panel:#1b1f26; --panel2:#222731; --line:#2e3542; --text:#e6e9ef; --muted:#8b94a5;
  --accent:#f5b83d; --accent2:#46c2e8; --ok:#5fd18b; --danger:#ef6a6a;
  --c-dist:#46c2e8; --c-poly:#b18cff; --c-area:#5fd18b; --c-rect:#5fd18b; --c-angle:#ff9f43; --c-calib:#ef6a6a;
  --font:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  --mono:ui-monospace,"SFMono-Regular","Consolas","Menlo",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.45 var(--font);overflow:hidden}
button,input,select{font:inherit;color:inherit}
#app{display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:var(--thw,150px) 1fr var(--sdw,320px);height:100vh;height:100dvh}
#app.noside{--sdw:0px}
#app.nothumbs{--thw:0px}
#app.nothumbs #thumbs{display:none}
#thumbs{grid-row:2;grid-column:1;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;overflow-x:hidden;padding:8px 10px 20px;min-height:0}
.th{position:relative;display:block;width:100%;margin:0 0 12px;padding:0;border:0;background:transparent;cursor:pointer;text-align:center;color:var(--muted)}
.th .pv{position:relative;background:#fff;border:2px solid transparent;border-radius:4px;box-shadow:0 2px 8px #0006;overflow:hidden;display:flex;align-items:center;justify-content:center;min-height:60px}
.th canvas{display:block;width:100%;height:auto}
.th .ph{width:100%;aspect-ratio:1.414;background:#e8eaee}
.th:hover .pv{border-color:#5a6475}
.th.on .pv{border-color:var(--accent);box-shadow:0 0 0 2px #f5b83d55,0 2px 8px #0006}
.th.on .no{color:var(--accent);font-weight:700}
.th .no{font:11px var(--mono);margin-top:4px;display:flex;justify-content:center;gap:6px;align-items:center}
.th .bd{position:absolute;top:4px;right:4px;display:flex;gap:3px;flex-direction:column;align-items:flex-end}
.th .bd span{font:600 9.5px var(--font);padding:1px 5px;border-radius:8px;background:#14171ccc;color:#fff;white-space:nowrap}
.th .bd .c{background:var(--accent);color:#1b1500}
.th .bd .s{background:#18251dd9;color:var(--ok)}
#thumbs .thead{font-size:11px;letter-spacing:.06em;color:var(--muted);margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
header{grid-column:1/4;display:flex;align-items:center;gap:6px;padding:6px 8px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.grp{display:flex;align-items:center;gap:2px;padding:0 6px;border-right:1px solid var(--line)}
.grp:last-child{border-right:0}
.tb{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 9px;border:1px solid transparent;border-radius:6px;background:transparent;cursor:pointer;white-space:nowrap}
.tb:hover{background:var(--panel2);border-color:var(--line)}
.tb.on{background:#3a3220;border-color:var(--accent);color:var(--accent)}
.tb:disabled{opacity:.35;cursor:default;background:transparent;border-color:transparent}
.tb svg{width:16px;height:16px;flex:none}
.tb kbd{font:10px var(--mono);color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:0 3px}
.tb.on kbd{color:var(--accent);border-color:#6b5520}
.brand{font-weight:700;letter-spacing:.02em;padding:0 8px 0 4px;display:flex;align-items:center;gap:6px}
.brand i{width:10px;height:10px;background:var(--accent);transform:rotate(45deg);display:inline-block}
.pagebox{display:flex;align-items:center;gap:4px}
.pagebox input{width:46px;height:26px;text-align:center;background:var(--bg);border:1px solid var(--line);border-radius:5px}
.scalebadge{height:30px;display:inline-flex;align-items:center;gap:6px;padding:0 10px;border-radius:6px;border:1px dashed var(--danger);color:var(--danger);cursor:pointer;background:transparent}
.scalebadge.set{border-style:solid;border-color:#3d5a45;color:var(--ok);background:#18251d}
#stage{position:relative;overflow:hidden;background:#3a3f48;touch-action:none}
#stage canvas{position:absolute;left:0;top:0}
#ov{cursor:crosshair}
#ov.pan{cursor:grab} #ov.panning{cursor:grabbing} #ov.sel{cursor:default}
#drop{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
#drop .card{pointer-events:auto;max-width:520px;margin:20px;padding:28px 30px;background:var(--panel);border:1px solid var(--line);border-radius:12px;text-align:center}
#drop h1{font-size:18px;margin:0 0 8px}
#drop p{color:var(--muted);margin:6px 0}
#drop .big{margin:16px 0 4px;height:40px;padding:0 20px;border-radius:8px;border:0;background:var(--accent);color:#1b1500;font-weight:700;cursor:pointer}
#stage.drag #drop .card{border-color:var(--accent);box-shadow:0 0 0 3px #f5b83d44}
#busy{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:#000c;padding:5px 12px;border-radius:20px;font-size:12px;display:none}
aside{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;overflow:hidden}
#app.noside aside{display:none}
#stage{grid-row:2;grid-column:2;min-width:0}
aside{grid-row:2;grid-column:3}
aside section{padding:10px 12px;border-bottom:1px solid var(--line)}
aside h2{font-size:11px;letter-spacing:.08em;color:var(--muted);margin:0 0 8px;font-weight:600;text-transform:uppercase;display:flex;align-items:center;justify-content:space-between}
.row{display:flex;align-items:center;gap:8px;margin:4px 0;flex-wrap:wrap}
.row label{display:inline-flex;align-items:center;gap:4px;cursor:pointer}
select,.inp{height:26px;background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:0 6px}
.inp{width:90px}
#list{flex:1;overflow:auto;padding:4px 0}
.mi{display:grid;grid-template-columns:18px 10px 1fr auto 22px;gap:6px;align-items:center;padding:6px 10px 6px 12px;border-left:3px solid transparent;cursor:pointer}
.mi:hover{background:var(--panel2)}
.mi.sel{background:#262c38;border-left-color:var(--accent)}
.mi .sw{width:14px;height:14px;border-radius:4px;border:2px solid rgba(255,255,255,.25);padding:0;cursor:pointer}
.mi .sw:hover{border-color:#fff}
.mi{grid-template-columns:18px 14px 1fr auto 22px !important}
#cpop{position:fixed;z-index:15;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;box-shadow:0 12px 40px #000a;display:none;width:196px}
#cpop.show{display:block}
#cpop .pal{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
#cpop .pal button{width:24px;height:24px;border-radius:6px;border:2px solid transparent;cursor:pointer;padding:0}
#cpop .pal button.on{border-color:#fff}
#cpop .cus{display:flex;align-items:center;gap:8px;margin-top:9px;font-size:12px;color:var(--muted)}
#cpop input[type=color]{width:36px;height:24px;border:1px solid var(--line);border-radius:5px;background:transparent;padding:0;cursor:pointer}
.mi .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:4.5em}
.mi .nm input{width:100%;height:22px;background:var(--bg);border:1px solid var(--accent);border-radius:4px;padding:0 4px}
.mi .v{font-family:var(--mono);font-size:12px;text-align:right;white-space:nowrap}
.mi .v small{display:block;color:var(--muted);font-size:10.5px}
.mi .x{border:0;background:transparent;color:var(--muted);cursor:pointer;border-radius:4px;height:22px}
.mi .x:hover{color:var(--danger);background:#3a2222}
.empty{color:var(--muted);padding:14px 12px;font-size:12px}
.tot{padding:8px 12px;border-top:1px solid var(--line);font-family:var(--mono);font-size:12px;background:var(--panel2)}
.tot div{display:flex;justify-content:space-between}
.tot span:first-child{font-family:var(--font);color:var(--muted)}
.mini{height:24px;padding:0 8px;border-radius:5px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-size:12px}
.mini:hover{border-color:var(--muted)}
footer{grid-column:1/4;display:flex;gap:14px;align-items:center;padding:3px 10px;background:var(--panel);border-top:1px solid var(--line);font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden}
footer b{color:var(--text);font-weight:500;font-family:var(--mono)}
footer .hint{color:var(--accent);overflow:hidden;text-overflow:ellipsis}
.tog{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 7px;border-radius:4px;border:1px solid var(--line);cursor:pointer;font-size:11.5px;user-select:none}
.tog.on{border-color:var(--accent2);color:var(--accent2);background:#16303a}
.seg{display:inline-flex;align-items:center;height:26px;border:1px solid var(--line);border-radius:5px;overflow:hidden;font-size:11.5px;margin-left:4px}
.seg .segl{padding:0 7px;color:var(--muted)}
.seg button{height:100%;border:0;border-left:1px solid var(--line);background:transparent;padding:0 8px;cursor:pointer;color:var(--muted)}
.seg button.on{background:#16303a;color:var(--accent2)}
.seg button[data-o="0"].on{background:var(--panel2);color:var(--text)}
/* modal */
#modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:10}
#modal.show{display:flex}
.dlg{width:min(460px,94vw);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;box-shadow:0 20px 60px #000a}
.dlg h3{margin:0 0 4px;font-size:16px}
.dlg .sub{color:var(--muted);font-size:12px;margin:0 0 12px}
.tabs{display:flex;gap:4px;margin-bottom:12px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:transparent;padding:6px 10px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent}
.tabs button.on{color:var(--text);border-bottom-color:var(--accent)}
.fld{display:grid;grid-template-columns:110px 1fr;gap:8px;align-items:center;margin:8px 0}
.fld .inp{width:100%}
.ratio{display:flex;align-items:center;gap:6px}
.ratio .inp{width:90px}
.note{font-size:12px;color:var(--muted);background:var(--bg);border-radius:6px;padding:8px 10px;margin:10px 0}
.note b{color:var(--text)}
.cands{display:flex;flex-direction:column;gap:6px;margin:4px 0 8px}
.cand{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--bg)}
.cand:has(input:checked){border-color:var(--accent);background:#2a2516}
.cand input{margin-top:3px}
.cand b{font-family:var(--mono);font-size:14px}
.cand em{font-style:normal;font-size:10.5px;background:var(--accent);color:#1b1500;border-radius:3px;padding:1px 5px;margin-left:8px;vertical-align:2px}
.cand small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
.acts{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.btn{height:32px;padding:0 14px;border-radius:7px;border:1px solid var(--line);background:var(--panel2);cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#1b1500;font-weight:700}
#toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:#000d;padding:7px 14px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
#toast.show{opacity:1}
.helpk{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:12px}
.helpk kbd{font:11px var(--mono);border:1px solid var(--line);border-radius:3px;padding:0 4px;color:var(--accent)}
 #props{border-top:1px solid var(--line);padding:8px 12px 10px;max-height:58%;overflow:auto;background:#1d222b}
#props h2{font-size:11px;letter-spacing:.06em;color:var(--muted);margin:2px 0 8px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.pg{display:grid;grid-template-columns:88px 1fr auto;gap:6px;align-items:center;margin:5px 0}
.pg label{color:var(--muted);font-size:12px}
.pg .inp,.pg select{width:100%;min-width:0}
.pg .u{color:var(--muted);font-size:11px}
.spec{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px 9px;margin:6px 0;font-size:11.5px;line-height:1.55}
.spec b{font-size:12.5px}
.spec .pill{display:inline-block;font-size:10px;border:1px solid var(--line);border-radius:3px;padding:0 4px;margin-left:5px;color:var(--accent2)}
.spec .mut{color:var(--muted)}
.spec .links{margin-top:4px;display:flex;gap:10px;flex-wrap:wrap}
.spec a{color:var(--accent2)}
.warn{color:#ff8a65;font-weight:600}
table.ops{width:100%;border-collapse:collapse;font-size:11.5px}
table.ops th{color:var(--muted);font-weight:500;text-align:left;padding:2px}
table.ops td{padding:1px}
table.ops input{width:100%;height:22px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:0 3px;font:11.5px var(--mono)}
table.ops tr.auto input{border-color:#b8a000;background:#26240f}
table.ops td:first-child{width:24%}
table.ops .x{border:0;background:transparent;color:var(--muted);cursor:pointer}
.pmini{font-size:11px;color:var(--muted);margin:4px 0}
.res{margin:10px 0 8px;font-size:12px;border-top:1px solid var(--line);padding-top:8px}
.res div{display:flex;justify-content:space-between;padding:1px 0}
.res span{color:var(--muted)} .res b{font-family:var(--mono);font-weight:500}
.res .hl b{color:var(--accent);font-weight:700}
.btn.wide{width:100%}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:2px 9px;font-size:12px;cursor:pointer;color:var(--text)}
.chip.kw{border-color:#8a6420;color:var(--accent)}
.chip.on{background:var(--accent);color:#1b1500;border-color:var(--accent)}
.segb{display:inline-flex;border:1px solid var(--line);border-radius:5px;overflow:hidden;height:26px}
.segb button{border:0;background:transparent;color:var(--muted);padding:0 10px;cursor:pointer;border-left:1px solid var(--line)}
.segb button:first-child{border-left:0}
.segb button.on{background:#3a3220;color:var(--accent)}
.lens{display:flex;gap:8px;flex-wrap:wrap;font-size:12px}
.lens label{display:inline-flex;gap:3px;align-items:center;cursor:pointer}
table.lay{width:100%;border-collapse:collapse;font-size:11.5px;margin:6px 0 2px}
table.lay th{color:var(--muted);font-weight:500;text-align:left;padding:2px 3px;border-bottom:1px solid var(--line)}
table.lay td{padding:3px;border-bottom:1px dotted var(--line);font-family:var(--mono)}
table.lay td:first-child{font-family:var(--font)}
table.lay td small{display:block;color:var(--muted);font-size:10px}
table.lay tr.bad td{color:#ff8a65}
.dlg.wide{width:min(1400px,96vw);max-height:94vh;display:flex;flex-direction:column}
.esvg{overflow:auto;background:#fff;border-radius:6px;border:1px solid var(--line);flex:1;min-height:200px;max-height:58vh}
.etabs{flex-wrap:wrap}
table.qty{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px}
table.qty th,table.qty td{border-bottom:1px solid var(--line);padding:3px 6px;text-align:left}
table.qty td:nth-child(4){font-family:var(--mono);text-align:right}
#eqty{max-height:22vh;overflow:auto}
@media (max-width:1720px){ .tb kbd{display:none} .tb{padding:0 7px} .grp{padding:0 4px} }
@media (max-width:2100px){ #tools .tb .lbl, #ntools .tb .lbl{display:none} .seg .segl{display:none} }
@media (max-width:1250px){ .modeseg .lbl{display:none} }
@media (min-width:821px) and (max-width:1700px){ .brand span, #bOpen .lbl{display:none} .tb{padding:0 6px;gap:3px} .grp{padding:0 3px} .cloud{padding:3px 6px} .scalebadge{padding:0 7px} }
#app.notemode .snapgrp{display:none}
.tb kbd{display:none}
@media (min-width:821px) and (max-width:1100px){ .cloud{display:none !important} }
@media (min-width:821px) and (max-width:1320px){ #bRotL, #bRotR, #bFit{display:none !important} .modeseg button{padding:0 7px} }
/* ---- touch / iPhone ---- */
header{padding-top:max(6px, env(safe-area-inset-top)); padding-left:max(8px, env(safe-area-inset-left)); padding-right:max(8px, env(safe-area-inset-right))}
footer{padding-bottom:max(3px, env(safe-area-inset-bottom)); padding-left:max(10px, env(safe-area-inset-left))}
#stage{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#loupe{position:absolute;width:150px;height:150px;border-radius:50%;border:2px solid var(--accent);box-shadow:0 6px 24px #000a;pointer-events:none;display:none;z-index:4;background:#fff}
#actbar{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:none;gap:6px;z-index:5;background:#14171ce6;border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 8px 24px #0008}
#actbar.show{display:flex}
#zoomctl{position:absolute;right:max(10px,env(safe-area-inset-right));bottom:84px;display:none;flex-direction:column;gap:6px;z-index:5}
#zoomctl button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:#14171ce0;color:var(--text);font-size:20px;box-shadow:0 4px 14px #0007}
@media (pointer:coarse){ #zoomctl{display:flex} }
#actbar button{height:40px;min-width:56px;padding:0 14px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);font-size:14px;cursor:pointer}
#actbar button.pri{background:var(--accent);border-color:var(--accent);color:#1b1500;font-weight:700}
#actbar .info{align-self:center;font:12px var(--mono);color:var(--accent);padding:0 6px;white-space:nowrap}
.sheethead{display:none}
#row2{display:contents}
#an{pointer-events:none}
.modeseg button{font-size:12.5px;padding:0 10px}
.modeseg button.on{background:#3a3220 !important;color:var(--accent) !important}
.bmb{font-size:16px;color:var(--muted)} .bmb.on{color:var(--accent)}
.cloud{font-size:11.5px;padding:3px 8px;border-radius:10px;border:1px solid #3d5a45;color:var(--ok);white-space:nowrap;cursor:default}
.cloud[data-st="sync"]{color:var(--accent2);border-color:#2b5566} .cloud[data-st="err"]{color:#ff8a65;border-color:#6b3a2b}
#ltabs{display:flex;gap:2px;align-items:center;margin:-2px 0 8px;border-bottom:1px solid var(--line)}
#ltabs button{border:0;background:transparent;color:var(--muted);font-size:11px;padding:4px 4px 6px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
#ltabs button.on{color:var(--text);border-bottom-color:var(--accent)}
#ltabs #thN{margin-left:auto;font-size:10px;color:var(--muted)}
#app:not(.wideleft) #ltabs #thN{display:none}
#app.wideleft{--thw:250px}
#bmPane .sec{font-size:11px;color:var(--muted);letter-spacing:.05em;margin:2px 0 6px}
.bmi,.oli,.sri{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--text);padding:6px 6px;border-radius:6px;cursor:pointer;font-size:12.5px}
.bmi:hover,.oli:hover,.sri:hover{background:var(--panel2)}
.bmi b{color:var(--accent)} .bmi small{display:block;color:var(--muted);font-size:10.5px;margin-left:18px}
.sri{display:grid;grid-template-columns:30px 40px 1fr;gap:4px;align-items:baseline}
.sri .pg{font:11px var(--mono);color:var(--accent)} .sri .kd{font-size:10px;color:var(--muted)} .sri .tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sri mark{background:#f5b83d55;color:#fff;border-radius:2px}
#srQ{width:100%;margin-bottom:8px;height:30px}
.th .bd .b{background:#14171ccc;color:var(--accent)}
#stylebar{position:absolute;left:50%;top:10px;transform:translateX(-50%);display:none;align-items:center;gap:5px;flex-wrap:wrap;justify-content:center;max-width:calc(100% - 20px);background:#14171ced;border:1px solid var(--line);border-radius:12px;padding:6px 9px;z-index:5;box-shadow:0 6px 20px #0007}
#stylebar.show{display:flex}
#stylebar .sep{width:1px;height:20px;background:var(--line);margin:0 3px}
.cdot{width:20px;height:20px;border-radius:50%;border:2px solid #ffffff33;cursor:pointer;padding:0}

<script>
(() => {
'use strict';
const pdfjsLib = window.pdfjsLib;
if (pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const $ = s => document.querySelector(s);
const app = $('#app'), stage = $('#stage'), bg = $('#bg'), ov = $('#ov');
const bctx = bg.getContext('2d'), octx = ov.getContext('2d');
const PT_MM = 25.4 / 72;
const COLORS = { dist:'#46c2e8', poly:'#b18cff', area:'#5fd18b', rect:'#5fd18b', angle:'#ff9f43', calib:'#ef6a6a', arc:'#e83e8c', circle:'#e83e8c' };
const PALETTE = ['#e6194b','#1f77d4','#2ca02c','#ff7f0e','#9b30d9','#00a8a8','#e83e8c','#8c564b','#b8a000','#17becf','#d62728','#5b5bd6'];
function nextColor(){
  const used=new Map(PALETTE.map(c=>[c,0])); for (const m of pageMeas()) if (used.has(m.color)) used.set(m.color, used.get(m.color)+1);
  const last=pageMeas().length? pageMeas()[pageMeas().length-1].color : null;
  const start = last? (PALETTE.indexOf(last)+1)%PALETTE.length : 0;
  let best=null; for (let k=0;k<PALETTE.length;k++){ const c=PALETTE[(start+k)%PALETTE.length]; if (!best || used.get(c)<used.get(best)) best=c; }
  return best;
}
const colOf = m => m.kind==='calib'? COLORS.calib : (m.color||COLORS[m.kind]);
const KIND_JP = { dist:'距離', poly:'連続線', area:'面積', rect:'矩形', angle:'角度', wall:'壁', arc:'円弧', circle:'円' };
const PAPERS = { A0:1189, A1:841, A2:594, A3:420, A4:297, B1:1030, B2:728, B3:515, B4:364 };

// ---------- state ----------
const S = {
  doc:null, img:null, kind:null, name:'', key:'',
  nPages:0, page:1, pdfPage:null, W:0, H:0, isPdf:false,
  zoom:1, px:0, py:0, dpr:1, cw:0, ch:0,
  tool:'dist', snapOn:true, orthoOn:false, shift:false, space:false,
  draft:null,          // {kind, pts:[]}
  cursor:null,         // world point after snap
  rawCursor:null, snap:null,
  sel:null, hover:null,
  meas:{},             // page -> [m]
  scales:{},           // page -> {mmPerUnit,label}
  rots:{}, detect:{}, orthoMode:0, autoScale:true,
  geo:null, geoPage:0,
  preview:null, previewScale:1,
  undo:[], idSeq:1,
  drag:null,
};

// ---------- utils ----------
const toast = (msg) => { const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove('show'),1800); };
const busy = (msg) => { const b=$('#busy'); b.textContent=msg||''; b.style.display=msg?'block':'none'; };
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const d2 = (a,b) => Math.hypot(a.x-b.x, a.y-b.y);
// view rotation (clockwise, 90° steps). world = unrotated page coords; "R" = rotated view coords
const rot = () => (S.rots[S.page]||0);
const RW = () => rot()%180 ? S.H : S.W;
const RH = () => rot()%180 ? S.W : S.H;
function toR(p){ const r=rot(); return r===90? {x:S.H-p.y, y:p.x} : r===180? {x:S.W-p.x, y:S.H-p.y} : r===270? {x:p.y, y:S.W-p.x} : {x:p.x, y:p.y}; }
function fromR(q){ const r=rot(); return r===90? {x:q.y, y:S.H-q.x} : r===180? {x:S.W-q.x, y:S.H-q.y} : r===270? {x:S.W-q.y, y:q.x} : {x:q.x, y:q.y}; }
const w2s = p => { const q=toR(p); return { x:q.x*S.zoom+S.px, y:q.y*S.zoom+S.py }; };
const s2w = p => fromR({ x:(p.x-S.px)/S.zoom, y:(p.y-S.py)/S.zoom });
function viewMatrix(){ // canvas transform world→screen (CSS px)

        const t1=(x1-it.o.x)*it.dx+(y1-it.o.y)*it.dy, t2=(x2-it.o.x)*it.dx+(y2-it.o.y)*it.dy; const tc=it.w/2;
        if (Math.min(t1,t2)>tc || Math.max(t1,t2)<tc) continue;
        const sc=Math.abs(sd+0.3*it.h); if (!best||sc<best.sc) best={sc,L}; } }
      if (!best) continue; n++;
      const ratio=val/(best.L*PT_MM);
      const N=STD_N.find(N=>Math.abs(ratio/N-1)<0.02); if (N){ matched++; votes.set(N,(votes.get(N)||0)+1); }
    }
    res.dims={n, matched, votes:[...votes.entries()].sort((a,b)=>b[1]-a[1])};
  }
  // 推奨値
  const L=Math.max(S.W,S.H)*PT_MM; const pp=res.pagePaper;
  const cands=[];
  for (const [k,N] of Object.entries(res.paper)){ const f=PAPERS[k]/L; const eff=N*f; cands.push({src:`図面枠「${k}:1/${N}」`+(k===pp?'（このページの用紙）':`（${k}基準 → この用紙で 1/${+eff.toFixed(2)}）`), mmPerUnit:PT_MM*eff, eff, N, paper:k===pp?'':k, pri:k===pp?0:1}); }
  const noteN=new Map(); for (const nt of res.notes) noteN.set(nt.N,(noteN.get(nt.N)||0)+1);
  for (const [N,c] of noteN) cands.push({src:`注記「S=1/${N}」×${c}`+(cands.length?'（部分詳細図の縮尺の可能性）':''), mmPerUnit:PT_MM*N, eff:N, N, pri:2});
  if (res.dims) for (const [N,c] of res.dims.votes.slice(0,3)) if (c>=3) cands.push({src:`寸法照合 1/${N}（寸法文字 ${c}/${res.dims.n} 件が一致）`, mmPerUnit:PT_MM*N, eff:N, N, pri:3, dimVote:c});
  cands.sort((a,b)=>a.pri-b.pri || (b.dimVote||0)-(a.dimVote||0));
  for (let i=cands.length-1;i>0;i--) if (cands.slice(0,i).some(c=>Math.abs(c.eff/cands[i].eff-1)<0.01)) cands.splice(i,1);
  // 寸法照合による裏付け
  const top=res.dims&&res.dims.votes[0];
  for (const c of cands){ const v=res.dims? (res.dims.votes.find(([N])=>Math.abs(N/c.eff-1)<0.02)||[0,0])[1] : 0; c.confirm=v; }
  let pick=cands[0]||null;
  if (pick && pick.pri===3 && !(top && top[1]>=4 && top[1]>=0.35*res.dims.matched)) pick=null; // 寸法のみは十分な一致がある時だけ

}
function scaleFromCand(c, auto){

}
function applyAutoScale(pg){

  const cur=S.scales[pg]; if (cur && !cur.auto) return;

}
function fitView(){
  if (!S.W) return; const m=24;
  const w=RW(), h=RH();
  S.zoom=Math.min((S.cw-2*m)/w,(S.ch-2*m)/h); S.px=(S.cw-w*S.zoom)/2; S.py=(S.ch-h*S.zoom)/2;
  viewChanged();
}
function zoomAt(f, sx, sy){
  const nz=Math.max(0.02, Math.min(400, S.zoom*f)); f=nz/S.zoom;
  S.px = sx-(sx-S.px)*f; S.py = sy-(sy-S.py)*f; S.zoom=nz; viewChanged();
}
let viewVer=0, hiTimer=0, hiTask=null;
function viewChanged(){ viewVer++; scheduleSession(); drawAnn(); if (S.editing){ const it=S.editing.it, p=w2s({x:it.x,y:it.y}), ed=$('#txted'); ed.style.left=p.x+'px'; ed.style.top=p.y+'px'; ed.style.fontSize=(it.size*S.zoom)+'px'; } $('#rt').textContent=rot()+'°'; drawBg(); drawOv(); $('#sz').textContent=(S.zoom*(S.isPdf?1:1)*100).toFixed(0)+'%'; clearTimeout(hiTimer); hiTimer=setTimeout(renderHi, 160); }
function drawBg(){
  const c=bctx, d=S.dpr; c.setTransform(1,0,0,1,0,0); c.fillStyle='#3a3f48'; c.fillRect(0,0,bg.width,bg.height);
  if (!S.preview) return;

  c.fillStyle='#000'; c.shadowColor='rgba(0,0,0,.35)'; c.shadowBlur=12; c.fillRect(S.px,S.py,RW()*S.zoom,RH()*S.zoom); c.shadowBlur=0;

async function renderHi(){

function drawOv(){

  if (!S.W) return;

  S._wno=wallNoMap();

    const d=S.draft, arcs={...(d.arcs||{})}; const prev=d.pts[d.pts.length-1];
    if (S.cursor && prev && d.arcMode){ if (d.pendingMid) arcs[d.pts.length-1]=bulgeFromThrough(prev, d.pendingMid, S.cursor); else { const cb=curveBetween(prev, S.cursor); if (cb) arcs[d.pts.length-1]=bulgeFromThrough(prev, cb.mid, S.cursor); } }
    drawMeas(c, {kind:d.kind==='wall'?'poly':d.kind, pts, arcs, page:S.page, draft:true, color: d.kind==='calib'?null:nextColor()}, false, false);
    if (d.pendingMid){ const q=w2s(d.pendingMid); c.beginPath(); c.arc(q.x,q.y,4,0,TAU); c.fillStyle='#e83e8c'; c.fill(); }

    else if (t.startsWith('中点')) { c.moveTo(p.x,p.y-7); c.lineTo(p.x+7,p.y+5); c.lineTo(p.x-7,p.y+5); c.closePath(); }
    else if (t.startsWith('交点')) { c.moveTo(p.x-6,p.y-6); c.lineTo(p.x+6,p.y+6); c.moveTo(p.x+6,p.y-6); c.lineTo(p.x-6,p.y+6); }
    else if (t.startsWith('中心')) { c.arc(p.x,p.y,6,0,Math.PI*2); }
    else { c.moveTo(p.x-6,p.y-6); c.lineTo(p.x+6,p.y-6); c.lineTo(p.x-6,p.y+6); c.lineTo(p.x+6,p.y+6); c.closePath(); }
    c.stroke();

  }

    const p=w2s(S.cursor); c.save(); c.setLineDash([]);
    c.beginPath(); c.moveTo(p.x-16,p.y); c.lineTo(p.x-4,p.y); c.moveTo(p.x+4,p.y); c.lineTo(p.x+16,p.y); c.moveTo(p.x,p.y-16); c.lineTo(p.x,p.y-4); c.moveTo(p.x,p.y+4); c.lineTo(p.x,p.y+16);
    c.strokeStyle='rgba(255,255,255,.95)'; c.lineWidth=3; c.stroke(); c.strokeStyle='#e0245e'; c.lineWidth=1.2; c.stroke();
    c.beginPath(); c.arc(p.x,p.y,1.6,0,Math.PI*2); c.fillStyle='#e0245e'; c.fill(); c.restore();
  }
}
function isMeasureTool(){ return (['dist','poly','area','rect','angle','calib','wall','arc'].includes(S.tool) || S.openPick) && !S.space; }
function label(c, text, x, y, color, sub){

function drawMeas(c, m, sel, hov){

      c.beginPath(); c.moveTo(cc.x,cc.y); c.lineTo(mp.x,mp.y); c.setLineDash([5,4]); c.lineWidth=1.2; c.stroke(); c.setLineDash([]);

  c.restore();

  else { S.px-=e.deltaX||e.deltaY; viewChanged(); }
  // refresh cursor snap after zoom
  if (isMeasureTool()){ const w=s2w(sp); const prev=S.draft&&S.draft.pts.length?S.draft.pts[S.draft.pts.length-1]:null; S.cursor=resolvePoint(w,prev); drawOv(); }
}, {passive:false});

// ---------- keyboard ----------
window.addEventListener('keydown', e=>{
  if ($('#modal').classList.contains('show')){ if (e.key==='Escape') closeModal(); return; }
  if (e.target.tagName==='INPUT' || e.target.tagName==='SELECT' || e.target.tagName==='TEXTAREA' || e.target.isContentEditable) return;
  const k=e.key;
  if ((e.ctrlKey||e.metaKey) && (k.toLowerCase()==='y' || (k.toLowerCase()==='z' && e.shiftKey))){ e.preventDefault(); redo(); return; }
  if ((e.ctrlKey||e.metaKey) && k.toLowerCase()==='f'){ e.preventDefault(); setLeftTab('search'); return; }
  if ((e.ctrlKey||e.metaKey) && k.toLowerCase()==='d'){ e.preventDefault(); toggleBm(); return; }
  if (k==='Shift'){ S.shift=true; refreshCursor(); return; }
  if (k===' '){ S.space=true; ov.classList.add('pan'); e.preventDefault(); return; }
  if ((e.ctrlKey||e.metaKey) && k.toLowerCase()==='z'){ e.preventDefault(); undo(); return; }
  if (e.ctrlKey||e.metaKey||e.altKey) return;
  const nmap={b:'pen',m:'hl',x:'eraser',u:'lasso',t:'text',k:'stamp',n:'note',z:'laser'};
  if (nmap[k.toLowerCase()]) { if (S.mode!=='note') setMode('note'); setTool(nmap[k.toLowerCase()]); return; }
  const map={v:'select',h:'pan',d:'dist',l:'poly',a:'area',r:'rect',g:'angle',w:'wall',e:'arc'};
  if (map[k.toLowerCase()]) { const t=map[k.toLowerCase()]; if (S.mode!=='measure' && t!=='pan') setMode('measure'); setTool(t); return; }
  switch(k){
    case 'Escape': if (app.classList.contains('present')){ togglePresent(false); break; } if (S.selA.size||S.selM.size){ clearSel(); drawOv(); break; } if ($('#aipanel').classList.contains('show')){ $('#aipanel').classList.remove('show'); break; } if (S.openPick){ S.openPick=null; setHint(); drawOv(); } else if (S.draft){ S.draft=null; drawOv(); } else { S.sel=null; refreshList(); drawOv(); } break;
    case 'Enter': if (S.draft) finishDraft(); break;
    case 'q': case 'Q': toggleArcMode(); break;
    case 'Backspace': if (S.draft){ draftBack(); e.preventDefault(); } else if (S.selA.size||S.selM.size) selAction('del'); else if (S.sel) delMeas(S.sel); break;
    case 'Delete': if (S.selA.size||S.selM.size) selAction('del'); else if (S.sel) delMeas(S.sel); break;
    case 'f': case 'F': fitView(); break;
    case 'c': case 'C': openScale(); break;
    case 's': case 'S': case 'F3': e.preventDefault(); toggleSnap(); break;
    case 'F8': e.preventDefault(); toggleOrtho(); break;
    case 'o': case 'O': $('#file').click(); break;
    case 'PageDown': gotoPage(S.page+1); break;
    case 'PageUp': gotoPage(S.page-1); break;
    case '+': case '=': zoomAt(1.25, S.cw/2, S.ch/2); break;
    case '-': zoomAt(0.8, S.cw/2, S.ch/2); break;
    case '?': showHelp(); break;
    case 'p': case 'P': toggleThumbs(); break;
    case '[': rotateView(-1); break;
    case ']': rotateView(1); break;
  }
});
window.addEventListener('keyup', e=>{ if (e.key==='Shift'){ S.shift=false; refreshCursor(); } if (e.key===' '){ S.space=false; ov.classList.toggle('pan', S.tool==='pan'); drawOv(); } });
window.addEventListener('blur', ()=>{ S.shift=false; S.space=false; });
function refreshCursor(){ updateModeChip(); if (S.rawCursor && isMeasureTool()){ const prev=S.draft&&S.draft.pts.length?S.draft.pts[S.draft.pts.length-1]:null; S.cursor=resolvePoint(S.rawCursor,prev); drawOv(); } }
function toggleSnap(){ S.snapOn=!S.snapOn; $('#tSnap').classList.toggle('on',S.snapOn); setHint(); refreshCursor(); toast('スナップ '+(S.snapOn?'ON':'OFF')); }
function orthoEff(){ return S.shift ? (S.orthoMode? 0 : 1) : S.orthoMode; }
function setOrtho(m, quiet){ S.orthoMode=m; document.querySelectorAll('#orthoSeg button').forEach(b=>b.classList.toggle('on', +b.dataset.o===m)); try{localStorage.setItem('pdfmeasure:ortho',m);}catch(e){} refreshCursor(); updateModeChip(); if(!quiet) toast('直交モード：'+['OFF','90°（水平・垂直）','45°刻み'][m]); }
function toggleOrtho(){ setOrtho((S.orthoMode+1)%3); }
function updateModeChip(){ const e=orthoEff(); const el=$('#om'); if (el) el.textContent=['OFF','90°','45°'][e]+(S.shift?'（Shift）':''); }

// ---------- list ----------
function delMeas(id){ snapshot('削除する前', 20000); pushUndo(); for (const pg in S.meas) S.meas[pg]=S.meas[pg].filter(m=>m.id!==id); if (S.sel===id) S.sel=null; save(); refreshList(); drawOv(); }
function refreshAll(){ refreshScaleBadge(); refreshList(); setHint(); drawOv(); refreshThumbBadges(); }
function refreshList(){
  const el=$('#list'); const list=pageMeas();
  if (!list.length){ el.innerHTML='<div class="empty">まだ計測がありません。<br>上部のツール（距離 D／連続線 L／面積 A／矩形 R／角度 G）を選んで図面をクリックしてください。</div>'; }
  else {
    el.innerHTML='';
    for (const m of list){
      const v=valueOf(m);
      const d=document.createElement('div'); d.className='mi'+(m.id===S.sel?' sel':''); d.dataset.id=m.id;
      d.innerHTML=`<input type="checkbox" ${m.inc!==false?'checked':''} title="合計に含める"><button class="sw" title="色を変更" style="background:${colOf(m)}"></button><span class="nm" title="ダブルクリックで名前変更"></span><span class="v"><span class="vm"></span><small class="vs"></small></span><button class="x" title="削除">✕</button>`;
      d.querySelector('.nm').textContent=(wallOk(m)&&wallNoMap().get(m.id)? CIRC(wallNoMap().get(m.id))+' ' : '')+m.name; d.querySelector('.vm').textContent=v.main; d.querySelector('.vs').textContent=v.sub;
      d.querySelector('input').addEventListener('click', ev=>{ ev.stopPropagation(); m.inc=ev.target.checked; save(); refreshTotals(); });
      d.querySelector('.sw').addEventListener('click', ev=>{ ev.stopPropagation(); openColorPop(ev.currentTarget, m); });
      d.querySelector('.x').addEventListener('click', ev=>{ ev.stopPropagation(); delMeas(m.id); });
      d.addEventListener('click', ()=>{ S.sel=m.id; refreshList(); drawOv(); });
      d.addEventListener('dblclick', ev=>{ if (ev.target.closest('.nm')) renameRow(d,m); else zoomTo(m); });
      d.addEventListener('mouseenter', ()=>{ S.hover=m.id; drawOv(); }); d.addEventListener('mouseleave', ()=>{ S.hover=null; drawOv(); });
      el.appendChild(d);
    }
    const s=el.querySelector('.mi.sel'); if (s) s.scrollIntoView({block:'nearest'});
  }
  refreshTotals(); refreshProps(); refreshThumbBadges();
}
function refreshListValues(){ for (const m of pageMeas()){ const d=document.querySelector(`.mi[data-id="${m.id}"]`); if(!d) continue; const v=valueOf(m); d.querySelector('.vm').textContent=v.main; d.querySelector('.vs').textContent=v.sub; } refreshTotals(); }
function renameRow(d,m){
  const nm=d.querySelector('.nm'); const inp=document.createElement('input'); inp.value=m.name; nm.innerHTML=''; nm.appendChild(inp); inp.focus(); inp.select();
  const done=ok=>{ if (ok && inp.value.trim()){ pushUndo(); m.name=inp.value.trim(); save(); } refreshList(); drawOv(); };
  inp.addEventListener('keydown', e=>{ if (e.key==='Enter') done(true); if (e.key==='Escape') done(false); e.stopPropagation(); });
  inp.addEventListener('blur', ()=>done(true));
}
function zoomTo(m){
  const P=pathPts(m).map(toR); const xs=P.map(p=>p.x), ys=P.map(p=>p.y);
  const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const w=Math.max(x1-x0, 20), h=Math.max(y1-y0, 20);
  S.zoom=Math.min(S.cw/(w*1.6), S.ch/(h*1.6), 60); S.px=S.cw/2-(x0+x1)/2*S.zoom; S.py=S.ch/2-(y0+y1)/2*S.zoom; viewChanged();
}
function refreshTotals(){
  let L=0, A=0, nL=0, nA=0;
  for (const m of pageMeas()){ if (m.inc===false) continue; const pts=geomPts(m);
    if (m.kind==='dist' && !wallOk(m)){ L+=d2(pts[0],pts[1]); nL++; } else if (m.kind==='poly' && !wallOk(m)){ L+=pathLen(m,false); nL++; }
    else if (m.kind==='area'||m.kind==='rect'||m.kind==='circle'){ A+=shapeArea(m); nA++; } }
  let WA=0, nW=0; for (const m of pageMeas()) if (m.inc!==false && wallOk(m)){ WA+=computeWall(m).net; nW++; }
  $('#tot').innerHTML = `<div><span>長さ合計（${nL}件）</span><b>${nL?fmtLen(L):'–'}</b></div><div><span>面積合計（${nA}件）</span><b>${nA?fmtArea(A):'–'}</b></div>`+(nW?`<div class="wtot" title="クリックで壁の一括設定・集計を開く" style="cursor:pointer"><span>壁面積合計（${nW}件・片面）🧱</span><b>${fmtMm2(WA)}</b></div>`:'');
  const wt=$('#tot').querySelector('.wtot'); if (wt) wt.onclick=()=>openWallBatch({});
}
async function copyTable(){
  const lu=$('#uLen').value, au=$('#uArea').value;
  const lf = lu==='m'?1/1000:lu==='cm'?1/10:1, af = au==='m²'?1/1e6:au==='cm²'?1/100:1;
  const rows=[['ページ','名前','種類',`長さ(${lu})`,`面積(${au})`,'角度(°)','縮尺','壁高さ(mm)','壁面積・控除後(m²)','開口面積(m²)','壁仕様',`半径(${lu})`]];
  const pages=Object.keys(S.meas).map(Number).sort((a,b)=>a-b);
  for (const pg of pages) for (const m of S.meas[pg]){ const r=rawValue(m); const sc=scaleOf(pg); const k=mmPer(pg);
    rows.push([pg, m.name, wallOk(m)?'壁':KIND_JP[m.kind], r.len!=null? (k!=null? +(r.len*lf).toFixed(4): +r.len.toFixed(2)) :'', r.area!=null? (k!=null? +(r.area*af).toFixed(6): +r.area.toFixed(1)) :'', r.deg!=null? +r.deg.toFixed(3):'', sc? sc.label : (S.isPdf?'未設定(PDF原寸)':'未校正(px)'), ...(wallOk(m)? (c=>[m.wall.h, +(c.net/1e6).toFixed(3), +(c.opArea/1e6).toFixed(3), c.sys?c.sys.name:''])(computeWall(m)) : ['','','','']), r.r!=null? (k!=null? +(r.r*lf).toFixed(3) : +r.r.toFixed(2)) : '']); }
  const tsv=rows.map(r=>r.join('\t')).join('\n');
  try{ await navigator.clipboard.writeText(tsv); toast(`${rows.length-1}件をコピーしました（Excelに貼り付け可）`); }
  catch(e){ showText('計測結果（タブ区切り）', tsv); }
}

// ---------- color popover ----------
function openColorPop(anchor, m){
  const pop=$('#cpop'), pal=pop.querySelector('.pal'), inp=pop.querySelector('input');
  const setC=c=>{ pushUndo(); m.color=c; save(); refreshList(); drawOv(); };
  pal.innerHTML=''; for (const c of PALETTE){ const b=document.createElement('button'); b.style.background=c; b.className=c===m.color?'on':''; b.title=c; b.onclick=()=>{ setC(c); pop.classList.remove('show'); }; pal.appendChild(b); }
  inp.value=colOf(m); inp.oninput=()=>{ m.color=inp.value; drawOv(); const sw=document.querySelector(`.mi[data-id="${m.id}"] .sw`); if (sw) sw.style.background=inp.value; };
  inp.onchange=()=>{ m.color=inp.value; save(); refreshList(); };
  const r=anchor.getBoundingClientRect(); pop.style.left=Math.max(8,Math.min(innerWidth-210, r.left-90))+'px'; pop.style.top=(r.bottom+6)+'px';
  pop.classList.add('show'); S.sel=m.id; drawOv();
}
document.addEventListener('pointerdown', e=>{ const p=$('#cpop'); if (p.classList.contains('show') && !p.contains(e.target) && !e.target.classList.contains('sw')) p.classList.remove('show'); });

// ---------- scale dialog ----------
function refreshScaleBadge(){
  const b=$('#bScale'); const s=scaleOf();
  const mob=isMobile();
  if (s){ b.textContent = mob? s.label.replace(/（[^）]*基準）/,'').replace('（自動）',' 自動').replace(/（校正）/,' 校正') : '縮尺 '+s.label; b.classList.add('set'); }
  else { b.textContent = mob? '縮尺未設定' : (S.isPdf? '縮尺未設定（原寸）' : (S.W? '未校正（px）':'縮尺未設定')); b.classList.remove('set'); }
}
function closeModal(){ $('#modal').classList.remove('show'); $('#dlg').classList.remove('wide'); $('#dlg').onkeydown=null; }
function openScale(tab, measured, calPts){
  if (!S.W){ toast('先にファイルを開いてください'); return; }
  const dlg=$('#dlg'); const pageLong = Math.max(S.W,S.H)*PT_MM;
  const guessPaper = Object.entries(PAPERS).reduce((b,[k,v])=>Math.abs(v-pageLong)<Math.abs(b[1]-pageLong)?[k,v]:b, ['A3',420])[0];
  tab = tab || (S.isPdf?'auto':'calib');
  const det=S.detect[S.page];
  const autoHtml = !S.isPdf? '' : !det? '<div class="note">このページの文字情報を解析中です…数秒後にもう一度開いてください。</div>' :
    (det.cands.length? `<div class="cands">${det.cands.map((c,i)=>`<label class="cand"><input type="radio" name="cand" value="${i}" ${c===det.pick||(!det.pick&&i===0)?'checked':''}><span><b>1/${+c.eff.toFixed(2)}</b>${c===det.pick?'<em>推奨</em>':''}<small>${esc(c.src)}${c.confirm&&c.pri<3?`／寸法照合 ${c.confirm}件一致 ✓`:''}</small></span></label>`).join('')}</div>`
      : '<div class="note">このページの文字から縮尺表記（「A1:1/20」「S=1/50」「縮尺 1/100」など）や寸法との一致が見つかりませんでした。「縮尺を指定」か「2点で校正」をお使いください。</div>')
    + (det.dims? `<div class="note">寸法文字 ${det.dims.n} 件を寸法線と照合：${det.dims.votes.slice(0,3).map(([N,c])=>`1/${N} が ${c}件`).join('、')||'標準縮尺との一致なし'}</div>`:'')
    + `<div class="row"><label><input type="checkbox" id="fAuto" ${S.autoScale?'checked':''}> ページを開いたとき自動で縮尺を設定する（手動設定したページは変更しません）</label></div>`;
  dlg.innerHTML = `
    <h3>縮尺設定 — ${S.page} ページ</h3>
    <p class="sub">${S.isPdf? `このPDFページは ${ (S.W*PT_MM).toFixed(0)}×${(S.H*PT_MM).toFixed(0)} mm（${guessPaper}相当）です。` : `画像 ${S.W}×${S.H} px。画像には寸法情報がないため2点校正を使います。`}</p>
    <div class="tabs">${S.isPdf?'<button data-tab="auto">自動検出</button>':''}<button data-tab="ratio" ${S.isPdf?'':'disabled'}>縮尺を指定</button><button data-tab="calib">2点で校正</button></div>
    <div data-pane="auto">${autoHtml}</div>
    <div data-pane="ratio">
      <div class="fld"><span>図面の縮尺</span><div class="ratio">1 / <input class="inp" id="fN" type="number" min="0.01" step="any" value="${(scaleOf()&&scaleOf().N)||100}">
        <select id="fNp"><option value="">よく使う…</option>${[1,2,5,10,20,25,30,50,100,150,200,250,300,500,1000].map(n=>`<option>${n}</option>`).join('')}</select></div></div>
      <div class="fld"><span>縮尺の基準用紙</span><select id="fPaper"><option value="">このPDFの用紙（${guessPaper}）</option>${Object.keys(PAPERS).map(k=>`<option value="${k}">${k}（${k}で印刷した時の縮尺）</option>`).join('')}</select></div>
      <div class="note">図面枠に「A1:1/20　A3:1/40」のように複数書かれている場合は、どちらか一方を基準用紙と組み合わせて指定してください（例：基準用紙 A1・1/20）。</div>
    </div>
    <div data-pane="calib">
      <div class="note">${measured? `図面上で指定した長さ：<b>${(measured*(S.isPdf?PT_MM:1)).toFixed(2)} ${S.isPdf?'mm（紙面）':'px'}</b>` : '寸法がわかっている2点（寸法線の両端・通り芯間など）を図面上でクリックして校正します。'}</div>
      ${measured? `<div class="fld"><span>実際の長さ</span><div class="ratio"><input class="inp" id="fReal" type="number" min="0" step="any" placeholder="例 3000"><select id="fRealU"><option>mm</option><option>cm</option><option>m</option></select></div></div>` : `<button class="btn" id="bPick">図面上で2点を指定</button>`}
    </div>
    <div class="row" id="allRow" style="margin-top:10px"><label><input type="checkbox" id="fAll" ${S.nPages>1?'checked':'disabled'}> 全ページに適用（${S.nPages}ページ）</label></div>
    <div class="acts">${scaleOf()?'<button class="btn" id="bReset" style="margin-right:auto">解除</button>':''}<button class="btn" id="bCancel">キャンセル</button><button class="btn pri" id="bOk">適用</button></div>`;
  const setTab=t=>{ tab=t; dlg.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t)); dlg.querySelectorAll('[data-pane]').forEach(p=>p.style.display=p.dataset.pane===t?'':'none'); $('#allRow').style.display=t==='auto'?'none':''; };
  dlg.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>setTab(b.dataset.tab)); setTab(tab);
  const s0=scaleOf(); if (s0 && s0.paper) $('#fPaper').value=s0.paper;
  $('#fNp').onchange=e=>{ if (e.target.value) $('#fN').value=e.target.value; };
  $('#bCancel').onclick=()=>{ closeModal(); if (measured) setTool(S.prevTool||'dist'); };
  if ($('#bReset')) $('#bReset').onclick=()=>{ pushUndo(); if ($('#fAll').checked) S.scales={}; else delete S.scales[S.page]; save(); closeModal(); refreshAll(); };
  if ($('#bPick')) $('#bPick').onclick=()=>{ closeModal(); S.prevTool = S.tool==='calib'? 'dist' : S.tool; setTool('calib'); toast('既知寸法の2点をクリックしてください'); };
  if ($('#fAuto')) $('#fAuto').onchange=e=>{ S.autoScale=e.target.checked; try{localStorage.setItem('pdfmeasure:auto', S.autoScale?'1':'0');}catch(_){} if (S.autoScale) applyAutoScale(S.page); };
  $('#bOk').onclick=async ()=>{
    let sc; const sc_pages={};
    if (tab==='auto'){
      const r=dlg.querySelector('input[name=cand]:checked'); if (!r){ closeModal(); return; }
      const c=det.cands[+r.value]; pushUndo(); S.scales[S.page]=scaleFromCand(c, c===det.pick); save(); closeModal(); refreshAll(); toast('縮尺を設定しました：'+S.scales[S.page].label); return;
    }
    if (tab==='ratio'){
      const N=parseFloat($('#fN').value); if (!(N>0)){ toast('縮尺を入力してください'); return; }
      const paper=$('#fPaper').value; const f = paper? PAPERS[paper]/pageLong : 1;
      sc={mmPerUnit: PT_MM*f*N, N, paper, label:`1/${N}`+(paper?`（${paper}基準）`:'')};
    } else {
      if (!measured){ toast('先に2点を指定してください'); return; }
      const r=parseFloat($('#fReal').value); if (!(r>0)){ toast('実際の長さを入力してください'); $('#fReal').focus(); return; }
      const u=$('#fRealU').value; const mm = u==='m'? r*1000 : u==='cm'? r*10 : r;
      const mpu = mm/measured;
      let lab='2点校正';
      if (S.isPdf){ const N=mpu/PT_MM; lab=`≈1/${N>=10?N.toFixed(0):N.toFixed(2)}（校正）`; }
      sc={mmPerUnit:mpu, N:S.isPdf? +(mpu/PT_MM).toFixed(3):null, label:lab, calib:true};
    }
    const all=$('#fAll').checked;
    if (tab==='ratio' && sc.paper && all && S.isPdf){
      // 用紙基準はページごとの用紙サイズで換算
      $('#bOk').disabled=true; $('#bOk').textContent='計算中…';
      for (let i=1;i<=S.nPages;i++){ const v=(await S.doc.getPage(i)).getViewport({scale:1}); const L=Math.max(v.width,v.height)*PT_MM; sc_pages[i]={...sc, mmPerUnit:PT_MM*(PAPERS[sc.paper]/L)*sc.N}; }
    }
    pushUndo();
    if (all) for (let i=1;i<=S.nPages;i++) S.scales[i]= sc_pages[i] || {...sc}; else S.scales[S.page]=sc;
    save(); closeModal(); if (measured) setTool(S.prevTool||'dist'); refreshAll(); toast('縮尺を設定しました：'+sc.label);
  };
  $('#modal').classList.add('show');
  setTimeout(()=>{ const f=$('#fReal')||$('#fN'); if (f) { f.focus(); f.select&&f.select(); } },30);
  dlg.onkeydown=e=>{ if (e.key==='Enter' && e.target.tagName==='INPUT') $('#bOk').click(); };
}
function showText(title, text){
  $('#dlg').innerHTML=`<h3>${title}</h3><p class="sub">全選択してコピーしてください。</p><textarea style="width:100%;height:220px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:6px;font:12px var(--mono)" readonly></textarea><div class="acts"><button class="btn pri" id="bCancel">閉じる</button></div>`;
  $('#dlg textarea').value=text; $('#bCancel').onclick=closeModal; $('#modal').classList.add('show'); setTimeout(()=>$('#dlg textarea').select(),30);
}
function showHelp(){
  $('#dlg').innerHTML=`<h3>操作方法</h3><p class="sub">CADに近い操作で計測できます。</p>
  <div class="helpk">
   <kbd>D</kbd><span>2点間距離（ΔX・ΔYも表示）</span>
   <kbd>L</kbd><span>連続線（ポリライン）の長さ — Enter／ダブルクリック／右クリックで確定</span>

   <kbd>C</kbd><span>縮尺設定（縮尺指定 or 既知寸法で2点校正）</span>
   <kbd>S</kbd><span>オブジェクトスナップ ON/OFF（端点□・中点△・交点×・円中心○・線上⧗）</span>
   <kbd>F8</kbd><span>直交モード切替 OFF → 90°（水平・垂直）→ 45°刻み。上部の「直交」ボタンでも切替</span>

async function scanOpenings(){
  if (!S.isPdf || !S.doc) return;
  const doc=S.doc, marks={}, sched={}, texts={}; const SZ=/^W?[=:]?(\d{3,4})[×xX*＊]H?[=:]?(\d{3,4})$/i;
  for (let n=1;n<=S.nPages;n++){
    if (doc!==S.doc) return;
    let page, tc; try{ page=await doc.getPage(n); tc=await page.getTextContent(); }catch(e){ continue; }
    const vp=page.getViewport({scale:1}), T=vp.transform;
    const its=tc.items.filter(i=>i.str&&i.str.trim()).map(i=>{ const [a,b,c,d,e,f]=i.transform; return {s:nz(i.str).replace(/,/g,''), raw:i.str, x:T[0]*e+T[2]*f+T[4], y:T[1]*e+T[3]*f+T[5], h:Math.hypot(c,d)||8, w:i.width||0, hor:Math.abs(b)<1e-3&&a>0}; });
    const mp=mergePhrases(its); S.stexts[n]=mp; texts[n]=buildPhrases(its, mp); S.vtexts[n]=its.filter(i=>!i.hor && i.raw.trim().length>=1).map(i=>({raw:i.raw.trim(), x:i.x, y:i.y, h:i.h}));
    // join adjacent fragments on same line to catch "SD" + "-1"
    const pm=[];
    for (let i=0;i<its.length;i++){
      let s=its[i].s, m=s.match(OPEN_RE);
      if (!m && i+1<its.length && Math.abs(its[i+1].y-its[i].y)<its[i].h*0.5 && its[i+1].x-its[i].x < its[i].h*4){ const s2=s+its[i+1].s; m=s2.match(OPEN_RE); }
      if (m) pm.push({mark:normMark(m[1],m[2]), x:its[i].x, y:its[i].y, h:its[i].h});
    }
    if (pm.length) marks[n]=pm;
    // sizes on this page
    const sizes=[], Ws=[], Hs=[];
    for (const it of its){ let m=it.s.match(SZ); if (m){ const w=+m[1], h=+m[2]; if (w>=300&&w<=8000&&h>=300&&h<=6000) sizes.push({w,h,x:it.x,y:it.y}); continue; }
      m=it.s.match(/^W[=:]?(\d{3,4})$/i); if (m) Ws.push({v:+m[1],x:it.x,y:it.y});
      m=it.s.match(/^H[=:]?(\d{3,4})$/i); if (m) Hs.push({v:+m[1],x:it.x,y:it.y}); }
    if (sizes.length||Ws.length) for (const k of pm){
      if (sched[k.mark]) continue;
      const R=160; const near=(arr)=>{ let b=null; for (const s of arr){ const d=Math.hypot(s.x-k.x,(s.y-k.y)*0.7); if (d<R && (!b||d<b.d)) b={...s,d}; } return b; };
      const c=near(sizes); if (c){ sched[k.mark]={w:c.w,h:c.h,page:n,src:'建具表/表記'}; continue; }
      const w=near(Ws), h=near(Hs); if (w&&h) sched[k.mark]={w:w.v,h:h.v,page:n,src:'建具表/表記'};
    }
  }
  S.marks=marks; S.texts=texts; for (const k in sched) if (!S.schedule[k] || S.schedule[k].src!=='手入力') S.schedule[k]=sched[k];
  const nm=Object.values(marks).reduce((a,b)=>a+b.length,0);
  S.markInfo={n:nm, kinds:[...new Set(Object.values(marks).flat().map(m=>m.mark))].length, sched:Object.keys(sched).length};
  refreshProps();
}

  const rowH  = P.orient==='v'? P.bl : P.bw;          // 縦方向の1枚高さ

    sh=((sh%along)+along)%along;
    for (let x=g.a+sh-(sh?along:0); x<g.b-1; x+=along){ const xa=Math.max(x,g.a), xb=Math.min(x+along,g.b); if (xb-xa<1) continue;

function autoOpenings(m){
  const list=S.marks[m.page]||[]; if (!S.markInfo){ toast('開口記号を解析中です。数秒後にもう一度お試しください'); return; }
  if (!list.length){ toast('このページに開口記号（SD・AW等）の文字が見つかりません'); return; }
  const k=mmPer(m.page)??PT_MM; const lim=1500/k; const Lw=pathLen(m,false); const PP=pathPts(m);
  pushUndo(); m.wall.openings ||= []; let n=0;
  for (const mk of list){
    const pr=projectOnPoly(PP, mk); if (!pr || pr.d>lim || pr.s<0 || pr.s>Lw) continue;
    if (m.wall.openings.some(o=>o.mark===mk.mark && Math.abs(o.s+o.w/2 - pr.s*k)<1500)) continue;
    const d=defaultsForMark(mk.mark); const c=pr.s*k;
    m.wall.openings.push({mark:mk.mark, s:Math.max(0,Math.round(c-d.w/2)), w:d.w, h:d.h, sill:d.sill, auto:true}); n++;
  }
  m.wall.openings.sort((a,b)=>a.s-b.s);

function drawWallPlan(c, m, col, sel){
  const k=mmPer(m.page); if (!k) return; const sys=wallSys(m); const t=(sys? sys.t : 100)/k; const P=pathPts(m);
  c.save();
  // band
  for (let i=1;i<P.length;i++){ const a=P[i-1], b=P[i]; const L=d2(a,b); if (!L) continue; const nx=-(b.y-a.y)/L*t/2, ny=(b.x-a.x)/L*t/2;
    const q=[{x:a.x+nx,y:a.y+ny},{x:b.x+nx,y:b.y+ny},{x:b.x-nx,y:b.y-ny},{x:a.x-nx,y:a.y-ny}].map(w2s);
    c.beginPath(); q.forEach((p,j)=>j?c.lineTo(p.x,p.y):c.moveTo(p.x,p.y)); c.closePath(); c.fillStyle=col+(sel?'40':'26'); c.fill(); c.strokeStyle=col+'aa'; c.lineWidth=1; c.stroke(); }
  if (!wallOk(m)){ c.restore(); return; }
  const cw=computeWall(m);
  // openings
  for (const o of cw.ops){ const pa=pointAt(P,o.s/k), pb=pointAt(P,o.e/k); const A=w2s(pa), B=w2s(pb);
    c.beginPath(); c.moveTo(A.x,A.y); c.lineTo(B.x,B.y); c.strokeStyle='#fff'; c.lineWidth=Math.max(6, t*S.zoom); c.stroke();
    c.strokeStyle=col; c.lineWidth=2; c.setLineDash([4,3]); c.stroke(); c.setLineDash([]);
    if (o.mark){ c.font='600 11px '+getComputedStyle(document.body).fontFamily; c.fillStyle=col; c.textAlign='center'; const mx=(A.x+B.x)/2, my=(A.y+B.y)/2; c.lineWidth=3; c.strokeStyle='#fff'; c.strokeText(o.mark,mx,my-10); c.fillText(o.mark,mx,my-10); } }
  // studs
  const pitchPx=(cw.pitch/k)*S.zoom;
  if (pitchPx>=6 && cw.studs.length<4000){
    const sz=Math.max(2.5, Math.min(8, 45/k*S.zoom));
    for (const s of cw.studs){ const p=pointAt(P,s.x/k); const nx=-p.uy, ny=p.ux; const off = s.side==='A'? t/4 : s.side==='B'? -t/4 : 0;
      const q=w2s({x:p.x+nx*off, y:p.y+ny*off}); c.fillStyle = s.kind==='jamb'?'#d62728' : s.kind==='cut'? '#999' : col; c.fillRect(q.x-sz/2,q.y-sz/2,sz,sz); }
  }
  c.restore();
}

function elevSVG(c, layer, zoom, o){
  o=o||{}; let padL=70, padT=70, padB=70, padR=30, sc;
  if (o.compact){ padL=44; padT=34; padB=44; padR=44; sc=Math.max(0.005, Math.min((o.h-padT-padB)/c.H, (o.w-padL-padR)/c.Ltot)); }
  else { const availH=Math.max(260, Math.min(520, innerHeight*0.5)); sc=(availH/ c.H)*zoom; }
  const Wpx=c.Ltot*sc, Hpx=c.H*sc; const W=Wpx+padL+padR, Ht=Hpx+padT+padB;
  const X=x=>padL+x*sc, Y=y=>padT+Hpx-y*sc;

  s+=`<rect x="0" y="0" width="${W}" height="${Ht}" fill="#fff"/>`;
  // wall outline & runners
  s+=`<rect x="${X(0)}" y="${Y(c.H)}" width="${Wpx}" height="${Hpx}" fill="#f7f7f5" stroke="#333" stroke-width="1.2"/>`;
  const rh=Math.max(2,40*sc); s+=`<rect x="${X(0)}" y="${Y(c.H)}" width="${Wpx}" height="${rh}" fill="#9aa7b4"/><rect x="${X(0)}" y="${Y(0)-rh}" width="${Wpx}" height="${rh}" fill="#9aa7b4"/>`;
  for (const g of c.segs.slice(1)) s+=`<line x1="${X(g.a)}" y1="${Y(c.H)-14}" x2="${X(g.a)}" y2="${Y(0)+14}" stroke="#555" stroke-dasharray="6 4"/>`;
  const boardSvg = (layer!=='下地' && c.boards[layer])? c.boards[layer].list.map(b=>`<rect x="${X(b.x)}" y="${Y(b.y+b.h)}" width="${b.w*sc}" height="${b.h*sc}" fill="${b.cut?'#fde6c8':'#e3edf8'}" fill-opacity=".72" stroke="#1d4f86" stroke-width="1.4"/>`).join('') : '';
  // sway
  for (const y of c.sway) s+=`<line x1="${X(0)}" y1="${Y(y)}" x2="${X(c.Ltot)}" y2="${Y(y)}" stroke="#7a7a7a" stroke-dasharray="3 3"/>`;
  // studs
  const sw=Math.max(1.5, 45*sc);
  const studCol=s0=> s0.kind==='jamb'?'#d62728': s0.kind==='end'||s0.kind==='corner'?'#333': s0.side==='B'?'#2ca02c':'#1f77d4';
  const studOpacity = layer==='下地'? 1 : 0.55;
  for (const st of c.studs) for (const [y0,y1] of st.parts) s+=`<rect x="${X(st.x)-sw/2}" y="${Y(y1)}" width="${sw}" height="${(y1-y0)*sc}" fill="${studCol(st)}" opacity="${studOpacity}"/>`;
  s+=boardSvg;
  // openings
  for (const o of c.ops){ const y0=+o.sill||0, y1=y0+ +o.h; s+=`<rect x="${X(o.s)}" y="${Y(y1)}" width="${(o.e-o.s)*sc}" height="${(y1-y0)*sc}" fill="#fff" stroke="#d62728" stroke-width="1.5"/>`;
    s+=`<line x1="${X(o.s)}" y1="${Y(y1)}" x2="${X(o.e)}" y2="${Y(y0)}" stroke="#d62728" stroke-width=".6"/><line x1="${X(o.e)}" y1="${Y(y1)}" x2="${X(o.s)}" y2="${Y(y0)}" stroke="#d62728" stroke-width=".6"/>`;
    // header / sill members
    s+=`<rect x="${X(o.s)}" y="${Y(y1)-Math.max(2,40*sc)}" width="${(o.e-o.s)*sc}" height="${Math.max(2,40*sc)}" fill="#d62728" opacity=".75"/>`;
    if (y0>0) s+=`<rect x="${X(o.s)}" y="${Y(y0)}" width="${(o.e-o.s)*sc}" height="${Math.max(2,40*sc)}" fill="#d62728" opacity=".75"/>`;
    s+=`<text x="${(X(o.s)+X(o.e))/2}" y="${(Y(y1)+Y(y0))/2}" text-anchor="middle" fill="#b00" font-weight="bold">${esc(o.mark||'開口')}</text><text x="${(X(o.s)+X(o.e))/2}" y="${(Y(y1)+Y(y0))/2+14}" text-anchor="middle" fill="#b00">${Math.round(o.e-o.s)}×${Math.round(+o.h)}${y0?` 下端${y0}`:''}</text>`; }

  const xs=[...new Set(c.studs.map(t=>Math.round(t.x)))].sort((a,b)=>a-b);
  const yd=padT-26; s+=`<line x1="${X(0)}" y1="${yd}" x2="${X(c.Ltot)}" y2="${yd}" stroke="#444" stroke-width=".8"/>`;
  let lastLabelX=-1e9;
  for (let i=0;i<xs.length;i++){ s+=`<line x1="${X(xs[i])}" y1="${yd-4}" x2="${X(xs[i])}" y2="${yd+4}" stroke="#444"/>`;
    if (i>0){ const dx=xs[i]-xs[i-1], mx=(X(xs[i])+X(xs[i-1]))/2; if (dx*sc>22 && mx-lastLabelX>24){ s+=`<text x="${mx}" y="${yd-6}" text-anchor="middle" font-size="10" fill="#333">${dx}</text>`; lastLabelX=mx; } } }
  // cumulative small
  // overall & segments (bottom)
  const yb=Y(0)+28; s+=`<line x1="${X(0)}" y1="${yb}" x2="${X(c.Ltot)}" y2="${yb}" stroke="#444"/>`;
  for (const g of c.segs){ s+=`<line x1="${X(g.a)}" y1="${yb-5}" x2="${X(g.a)}" y2="${yb+5}" stroke="#444"/><line x1="${X(g.b)}" y1="${yb-5}" x2="${X(g.b)}" y2="${yb+5}" stroke="#444"/><text x="${(X(g.a)+X(g.b))/2}" y="${yb-5}" text-anchor="middle" fill="#222">${Math.round(g.L).toLocaleString()}</text>`; }

  for (const y of c.sway) s+=`<text x="${X(c.Ltot)+4}" y="${Y(y)+4}" font-size="9" fill="#777">振れ止め</text>`;
  // legend
  const lg=[['#1f77d4','スタッド（A面側）'],['#2ca02c','スタッド（B面側）'],['#333','端部・コーナー'],['#d62728','開口補強（縦枠・まぐさ/窓台）'],['#999','—']];
  let lx=padL; const ly=16; const legend=(c.arr==='千鳥'? lg.slice(0,4) : [['#1f77d4','スタッド'],lg[2],lg[3]]);

  s+='</svg>'; return s;

function quantities(c, m){
  const rows=[['区分','項目','仕様','数量','単位']]; const add=(...r)=>rows.push(r);

  const rowsMul = c.arr.startsWith('共通×')? +c.arr.slice(3) : 1;
  add('下地','スタッド（通し）',stud, cnt('reg')+cnt('end')+cnt('corner'),'本');
  add('下地','スタッド（開口部 切断）',stud, cnt('cut'),'本');
  add('下地','開口補強 縦枠',stud+'（補強材は設計図書による）', cnt('jamb'),'本');
  add('下地','スタッド長さ合計',stud, (c.studs.reduce((a,s)=>a+s.parts.reduce((b,[y0,y1])=>b+(y1-y0),0),0)*rowsMul/1000).toFixed(1),'m');
  add('下地','ランナー（上下）',runner, (c.Ltot*2*rowsMul/1000).toFixed(1),'m');
  if (c.sway.length) add('下地','振れ止め（@1200）','', (c.Ltot*c.sway.length*rowsMul/1000).toFixed(1),'m');
  add('下地','開口 まぐさ・窓台','', (c.ops.reduce((a,o)=>a+(o.e-o.s)*((+o.sill||0)>0?2:1),0)/1000).toFixed(2),'m');
  for (const k of c.layers){ const L=c.boards[k]; const nm=k.replace(/^A/,'A面 ').replace(/^B/,'B面 ');
    add('ボード',nm+'（'+(L.orient==='v'?'縦張り':'横張り')+'）', `${L.board.n} ${L.bw}×${L.bl}`, L.sheets,'枚');
    add('ボード',nm+' 割付ピース／ロス率', `張付面積 ${(L.used/1e6).toFixed(2)} m²`, `${L.list.length}片（切物 ${L.list.filter(b=>b.cut).length}）／${(L.loss*100).toFixed(1)}%`,''); }
  add('面積','壁面積（片面・開口控除後）','', (c.net/1e6).toFixed(2),'m²');
  add('面積','開口面積','', (c.opArea/1e6).toFixed(2),'m²');
  const tsv=rows.map(r=>r.join('\t')).join('\n');
  const html=`<table class="qty">${rows.map((r,i)=>`<tr>${r.map(v=>i?`<td>${esc(v)}</td>`:`<th>${esc(v)}</th>`).join('')}</tr>`).join('')}</table>

  return {tsv, html};
}

function inkPath(c, P){ c.beginPath(); c.moveTo(P[0][0],P[0][1]); if (P.length===2){ c.lineTo(P[1][0],P[1][1]); return; }

  const P=a.pts; if (!P.length) return;

  if (a.pr){ // 筆圧：区間ごとに太さを変える
    for (let i=1;i<P.length;i++){ const p0=P[i-1], p1=P[i]; const pm0 = i>1? [(P[i-2][0]+p0[0])/2,(P[i-2][1]+p0[1])/2] : p0; const pm1=[(p0[0]+p1[0])/2,(p0[1]+p1[1])/2];

function ellipsePts(sh,n=96){ const out=[]; for (let i=0;i<n;i++){ const t=i/n*TAU; out.push({x:sh.cx+sh.rx*Math.cos(t), y:sh.cy+sh.ry*Math.sin(t)}); } return out; }

// ---------- ジオメトリ ----------
function itemBBox(a){
  switch(a.t){
    case 'ink': { let x0=1e18,y0=1e18,x1=-1e18,y1=-1e18; for (const p of a.pts){ if(p[0]<x0)x0=p[0]; if(p[0]>x1)x1=p[0]; if(p[1]<y0)y0=p[1]; if(p[1]>y1)y1=p[1]; } const h=a.w/2; return {x0:x0-h,y0:y0-h,x1:x1+h,y1:y1+h}; }
    case 'shape': { if (a.k==='ellipse') return {x0:a.cx-a.rx,y0:a.cy-a.ry,x1:a.cx+a.rx,y1:a.cy+a.ry}; const xs=a.pts.map(p=>p.x), ys=a.pts.map(p=>p.y); return {x0:Math.min(...xs),y0:Math.min(...ys),x1:Math.max(...xs),y1:Math.max(...ys)}; }
    case 'text': { const t=textMetrics(a); return {x0:a.x,y0:a.y,x1:a.x+t.w,y1:a.y+t.h}; }
    case 'stamp': { const z=stampSize(a); return {x0:a.x-z.w/2,y0:a.y-z.h/2,x1:a.x+z.w/2,y1:a.y+z.h/2}; }
    case 'img': case 'tape': return {x0:a.x,y0:a.y,x1:a.x+a.w,y1:a.y+a.h};
    case 'note': { const r=12/S.zoom; return {x0:a.x-r,y0:a.y-r,x1:a.x+r,y1:a.y+r}; }
  } return {x0:0,y0:0,x1:0,y1:0};
}
function distSeg(p,a,b){ const dx=b.x-a.x, dy=b.y-a.y, l=dx*dx+dy*dy; let t=l? ((p.x-a.x)*dx+(p.y-a.y)*dy)/l : 0; t=Math.max(0,Math.min(1,t)); return Math.hypot(a.x+t*dx-p.x, a.y+t*dy-p.y); }
function itemHit(a,p,r){
  if (a.t==='ink'){ const P=a.pts; const rr=r+a.w/2; if (P.length===1) return Math.hypot(P[0][0]-p.x,P[0][1]-p.y)<rr; for (let i=1;i<P.length;i++) if (distSeg(p,{x:P[i-1][0],y:P[i-1][1]},{x:P[i][0],y:P[i][1]})<rr) return true; return false; }
  if (a.t==='shape'){ const rr=r+a.w/2; const P = a.k==='ellipse'? ellipsePts(a,72) : a.pts; const closed=a.k==='poly'||a.k==='ellipse'; for (let i=1;i<P.length+(closed?1:0);i++) if (distSeg(p,P[i-1],P[i%P.length])<rr) return true; return a.fill && closed && pointInPoly(p,P); }

function moveItem(a,dx,dy){ switch(a.t){ case 'ink': a.pts=a.pts.map(q=>[q[0]+dx,q[1]+dy,q[2]]); break; case 'shape': if (a.k==='ellipse'){ a.cx+=dx; a.cy+=dy; } else a.pts=a.pts.map(q=>({x:q.x+dx,y:q.y+dy})); break; default: a.x+=dx; a.y+=dy; } }
function scaleItem(a,ax,ay,k){ const S_=(x,y)=>[ax+(x-ax)*k, ay+(y-ay)*k];

// ---------- 図形認識 ----------
function rdp(P,eps){ if (P.length<3) return P.slice(); let dmax=0, idx=0; const a=P[0], b=P[P.length-1]; for (let i=1;i<P.length-1;i++){ const d=distSeg(P[i],a,b); if (d>dmax){ dmax=d; idx=i; } }
  if (dmax>eps){ const l=rdp(P.slice(0,idx+1),eps), r=rdp(P.slice(idx),eps); return l.slice(0,-1).concat(r); } return [a,b]; }
function recognizeShape(raw){
  const P=raw.map(q=>({x:q[0],y:q[1]})); if (P.length<3) return null;
  let L=0; for (let i=1;i<P.length;i++) L+=d2(P[i-1],P[i]);
  const xs=P.map(p=>p.x), ys=P.map(p=>p.y); const x0=Math.min(...xs), x1=Math.max(...xs), y0=Math.min(...ys), y1=Math.max(...ys); const diag=Math.hypot(x1-x0,y1-y0);
  if (diag*S.zoom<12) return null;
  const gap=d2(P[0],P[P.length-1]);
  if (gap/L>0.93) return snapLine({k:'line', pts:[P[0],P[P.length-1]]});
  const closed = gap < Math.max(diag*0.22, 16/S.zoom);
  if (!closed){ const s=rdp(P, diag*0.06); if (s.length<=5) return {k:'polyline', pts:s.map(p=>({...p}))}; return null; }
  // 楕円・円
  const cx=(x0+x1)/2, cy=(y0+y1)/2, rx=(x1-x0)/2, ry=(y1-y0)/2;
  let err=0; for (const p of P){ const v=Math.hypot((p.x-cx)/(rx||1),(p.y-cy)/(ry||1)); err+=Math.abs(v-1); } err/=P.length;

    if (ok){ const e=Math.atan2(V[1].y-V[0].y, V[1].x-V[0].x); const near=Math.round(e/(Math.PI/2))*(Math.PI/2);
      if (Math.abs(e-near)<0.14) return {k:'poly', pts:[{x:x0,y:y0},{x:x1,y:y0},{x:x1,y:y1},{x:x0,y:y1}], rect:true};
      const ux=Math.cos(e), uy=Math.sin(e); const w=d2(V[0],V[1]), h=(d2(V[1],V[2])+d2(V[3],V[0]))/2; const sg=Math.sign((V[1].x-V[0].x)*(V[2].y-V[1].y)-(V[1].y-V[0].y)*(V[2].x-V[1].x))||1; const nx=-uy*sg, ny=ux*sg;
      const o=V[0]; return {k:'poly', pts:[o,{x:o.x+ux*w,y:o.y+uy*w},{x:o.x+ux*w+nx*h,y:o.y+uy*w+ny*h},{x:o.x+nx*h,y:o.y+ny*h}]}; }

}
function snapLine(sh){ const [a,b]=sh.pts; const ang=Math.atan2(b.y-a.y,b.x-a.x); const st=Math.PI/4; const near=Math.round(ang/st)*st; if (Math.abs(ang-near)<0.06){ const L=d2(a,b); sh.pts=[a,{x:a.x+L*Math.cos(near), y:a.y+L*Math.sin(near)}]; } return sh; }

// ---------- 図形 → 計測 ----------
function shapeToMeas(sh, keepColor){
  let kind, pts;
  if (sh.k==='line'){ kind='dist'; pts=[{...sh.pts[0]},{...sh.pts[1]}]; }
  else if (sh.k==='polyline'){ kind='poly'; pts=sh.pts.map(p=>({...p})); }
  else if (sh.k==='poly'){ const xs=sh.pts.map(p=>p.x), ys=sh.pts.map(p=>p.y); if (sh.pts.length===4 && sh.rect){ kind='rect'; pts=[{x:Math.min(...xs),y:Math.min(...ys)},{x:Math.max(...xs),y:Math.max(...ys)}]; } else { kind='area'; pts=sh.pts.map(p=>({...p})); } }
  else if (sh.k==='ellipse'){ if (Math.abs(sh.rx-sh.ry)/Math.max(sh.rx,sh.ry)<0.08){ kind='circle'; const r=(sh.rx+sh.ry)/2; pts=[{x:sh.cx,y:sh.cy},{x:sh.cx+r,y:sh.cy}]; } else { kind='area'; pts=ellipsePts(sh,180); } }
  if (!kind) return null;
  const list=pageMeas(); const n=list.filter(m=>m.kind===kind).length+1;
  const m={id:S.idSeq++, kind, pts, page:S.page, name:KIND_JP[kind]+' '+n, inc:true, color: nextColor()};
  if ((kind==='area'||kind==='rect') && S.texts){ const c=roomCandidates(m)[0]; if (c && c.kw){ m.room=c.name; m.name=c.name; } }
  list.push(m); return m;
}

let holdTimer=0;
function noteDown(e, sp){

  if (t==='pen'||t==='hl'){

function armHold(){ clearTimeout(holdTimer); holdTimer=setTimeout(onHold, 520); }
function onHold(){

}
function noteMove(e, sp){
  const A=S.noteAct; const w=s2w(sp);
  if (S.tool==='laser'){ if (A || e.pointerType==='mouse'){ S.laser.push({x:sp.x,y:sp.y,t:performance.now()}); laserLoop(); } return; }
  if (S.tool==='eraser'){ S.eraserPos=sp; if (A) eraseAt(w); drawOv(); return; }
  if (!A || A.id!==e.pointerId) return;
  if (d2(sp,A.sp0)>4) A.moved=true;
  if (S.stroke){
    const st=S.stroke;
    if (st.shape){ if (st.shape.k==='line'){ st.shape.pts[1]={...w}; if (!st.shape.hlLine) snapLine(st.shape); } drawOv(); return; }
    const P=st.item.pts, last=P[P.length-1]; if (Math.hypot(w.x-last[0],w.y-last[1])*S.zoom<0.8) return;
    const evs = e.getCoalescedEvents? e.getCoalescedEvents() : [e];
    for (const ce of evs){ const q=s2w(evPt(ce)); P.push([q.x,q.y, ce.pointerType==='pen'? (ce.pressure||0.5) : 0.5]); }
    if (d2(sp,st.anchor)>3.5){ st.anchor=sp; armHold(); }

  }

  if (S.lassoDrag){ const D=S.lassoDrag;
    if (D.mode==='move'){ const dx=w.x-D.start.x, dy=w.y-D.start.y; restoreSel(D.orig); for (const a of selItems()) moveItem(a,dx,dy); for (const m of lassoMeas()){ m.pts=m.pts.map(p=>({x:p.x+dx,y:p.y+dy})); } }
    else { const k=Math.max(0.05, Math.hypot(w.x-D.anchor.x,w.y-D.anchor.y)/D.d0); restoreSel(D.orig); for (const a of selItems()) scaleItem(a,D.anchor.x,D.anchor.y,k); }

}
function noteUp(e, sp){
  const A=S.noteAct; if (!A || A.id!==e.pointerId) return; S.noteAct=null; clearTimeout(holdTimer);
  const t=A.t, w=sp? s2w(sp) : A.w0;
  if (S.stroke){ const st=S.stroke; S.stroke=null;
    let sh=st.shape; if (!sh && t==='pen' && S.style.shape) sh=recognizeShape(st.item.pts);
    if (sh){ pushUndo(); if (S.style.shapeMeasure && !st.item.hl){ const m=shapeToMeas(sh); if (m){ S.sel=m.id; save(); refreshList(); drawOv(); toast('図形を計測に変換：'+valueOf(m).main); return; } }
      const it={id:st.item.id, t:'shape', k:sh.k, c:st.item.c, w:st.item.w, arrow: S.style.arrow && (sh.k==='line'||sh.k==='polyline'), rect:sh.rect};
      if (sh.k==='ellipse') Object.assign(it,{cx:sh.cx,cy:sh.cy,rx:sh.rx,ry:sh.ry}); else it.pts=sh.pts;
      if (st.item.hl){ // マーカーの直線
        pageAnn().push({id:st.item.id, t:'ink', hl:true, c:st.item.c, w:st.item.w, pts:[[sh.pts[0].x,sh.pts[0].y,0.5],[sh.pts[1].x,sh.pts[1].y,0.5]]}); }
      else pageAnn().push(it);

    if (t==='pen' && S.style.scribble && isScribble(st.item.pts) && eraseUnderScribble(st.item.pts)){ drawOv(); return; }
    pushUndo(); pageAnn().push(st.item); saveAnn(); drawAnn(); drawOv(); return;
  }
  if (t==='eraser'){ if (S.eraseHit){ saveAnn(); } else S.undo.pop(); S.eraserPos=null; drawOv(); return; }
  if (S.lasso){ const L=S.lasso; S.lasso=null; if (L.length>2) selectLasso(L); else { const hit=pageAnn().slice().reverse().find(a=>itemHit(a,w,8/S.zoom)); if (hit){ if (hit.t==='tape' && !A.moved){ toggleTape(hit); } else { S.selA=new Set([hit.id]); } } } drawOv(); return; }
  if (S.lassoDrag){ S.lassoDrag=null; saveAnn(); refreshList(); drawAnn(); drawOv(); return; }
  if (t==='tape'){ const D=S.tapeDrag; S.tapeDrag=null; if (!D) return;
    if (!A.moved){ const hit=pageAnn().slice().reverse().find(a=>a.t==='tape'&&itemHit(a,w,4/S.zoom)); if (hit) toggleTape(hit); drawOv(); return; }
    const x0=Math.min(D.start.x,D.cur.x), y0=Math.min(D.start.y,D.cur.y), ww=Math.abs(D.cur.x-D.start.x), hh=Math.abs(D.cur.y-D.start.y);

  if (A.moved) return;
  if (t==='text'){ const hit=pageAnn().slice().reverse().find(a=>a.t==='text'&&itemHit(a,w,4/S.zoom)); if (hit) editText(hit,false); else { const st=S.style.txt; const it={id:S.idSeq++, t:'text', x:w.x, y:w.y-st.size/S.zoom*0.6, text:'', size:st.size/S.zoom, c:st.c}; editText(it,true); } return; }
  if (t==='stamp'){ placeStamp(w); return; }
  if (t==='note'){ const hit=noteAt(sp); if (hit) openNote(hit); else { const it={id:S.idSeq++, t:'note', x:w.x, y:w.y, text:'', c:'#ffd84d'}; openNote(it,true); } return; }
}
function noteCancel(){ clearTimeout(holdTimer); S.noteAct=null; S.stroke=null; S.lasso=null; S.tapeDrag=null; if (S.lassoDrag){ S.lassoDrag=null; } drawOv(); }
function eraseAt(w){
  const r=S.style.eraserR/S.zoom; const list=pageAnn(); let changed=false; const out=[];
  for (const a of list){
    if (a.t==='note' || !itemHit(a,w,r)){ out.push(a); continue; }
    changed=true; S.eraseHit++;
    if (S.style.eraser==='part' && a.t==='ink'){ // 部分消し：通過部分だけ切り取る
      let run=[]; const rr=r+a.w/2; const pieces=[];
      for (const q of a.pts){ if (Math.hypot(q[0]-w.x,q[1]-w.y)<rr){ if (run.length>1) pieces.push(run); run=[]; } else run.push(q); }
      if (run.length>1) pieces.push(run);
      pieces.forEach((pp,i)=>out.push({...a, id: i? S.idSeq++ : a.id, pts:pp}));
    }
  }
  if (changed){ S.ann[S.page]=out; drawAnn(); }
}
function toggleTape(a){ a.open=!a.open; saveAnn(); drawAnn(); }
function noteAt(sp){ return pageAnn().slice().reverse().find(a=>a.t==='note' && d2(w2s(a),sp)<16); }

// ---------- 投げ縄選択 ----------
function clearSel(){ S.selA=new Set(); S.selM=new Set(); }
const selItems = () => pageAnn().filter(a=>S.selA.has(a.id));
const lassoMeas = () => pageMeas().filter(m=>S.selM.has(m.id));

function restoreSel(o){ const A=new Map(o.a.map(s=>{ const j=JSON.parse(s); return [j.id,j]; })), M=new Map(o.m.map(s=>{ const j=JSON.parse(s); return [j.id,j]; }));

function drawNoteOverlay(c){

    if (S.stroke.shape){ const sh=S.stroke.shape; const it={t:'shape', k:sh.k, c:S.stroke.item.c, w:S.stroke.item.w, pts:sh.pts, cx:sh.cx, cy:sh.cy, rx:sh.rx, ry:sh.ry, arrow:S.style.arrow}; if (S.stroke.item.hl){ c.globalAlpha=0.4; } drawShape(c,it); }
    else drawInk(c,S.stroke.item); c.restore(); }
  // テープ作成中

// 単独のWebアプリとして使うとき：ファイル保存はブラウザの通常のダウンロード（iPhoneは共有シート）で行う
function browserSave({filename, data}){
  const blob = data instanceof Blob? data : new Blob([data], {type: /\.csv$/i.test(filename)? 'text/csv' : 'application/octet-stream'});
  const file = (()=>{ try{ return new File([blob], filename, {type: blob.type||'application/octet-stream'}); }catch(e){ return null; } })();
  if (file && matchMedia('(pointer:coarse)').matches && navigator.canShare && navigator.canShare({files:[file]}))
    return navigator.share({files:[file], title:filename}).then(()=>({status:'saved'}), e=>{ if (e && e.name==='AbortError'){ const x=new Error('declined'); x.code='declined'; throw x; } return anchorSave(blob, filename); });
  return anchorSave(blob, filename);
}

const AS={dbp:null, timer:0, sessTimer:0, lastSnapAt:0, lastSnapHash:'', lastSaved:0, failed:false, resuming:false};
function idbOpen(){
  if (AS.dbp) return AS.dbp;
  AS.dbp=new Promise(res=>{ try{ const r=indexedDB.open('pdfmeasure',1);
    r.onupgradeneeded=()=>{ const d=r.result; d.createObjectStore('files',{keyPath:'key'}); d.createObjectStore('data',{keyPath:'key'}); const sn=d.createObjectStore('snaps',{keyPath:'id',autoIncrement:true}); sn.createIndex('key','key'); d.createObjectStore('session',{keyPath:'id'}); };
    r.onsuccess=()=>res(r.result); r.onerror=()=>res(null); r.onblocked=()=>res(null); }catch(e){ res(null); } });
  return AS.dbp;
}
function idbReq(store, mode, fn){
  return idbOpen().then(db=>{ if (!db) return undefined; return new Promise((res,rej)=>{ try{ const tx=db.transaction(store,mode); const r=fn(tx.objectStore(store)); tx.oncomplete=()=>res(r && 'result' in r ? r.result : undefined); tx.onerror=()=>rej(tx.error); tx.onabort=()=>rej(tx.error); }catch(e){ rej(e); } }); })
    .catch(e=>{ console.warn('idb', e); if (e && e.name==='QuotaExceededError') toast('端末の保存容量が不足しています。履歴の古いファイルを削除してください'); return undefined; });
}

  let e=r.list.find(x=>x.key===S.key); if (!e){ e={key:S.key, name:S.name, size:0}; r.list.unshift(e); }
  Object.assign(e, patch, {t:Date.now(), name:S.name}); e.m=Object.values(S.meas).reduce((a,b)=>a+b.length,0); e.a=Object.values(S.ann).reduce((a,b)=>a+b.length,0); e.n=S.nPages;

}
// ---- ファイル本体の保存（次回そのまま再開できるように） ----
async function storeFile(f){
  const key=S.key; const ex=await idbGet('files', key);
  if (!ex) await idbPut('files', {key, name:f.name, type:f.type||(/\.pdf$/i.test(f.name)?'application/pdf':''), size:f.size, blob:f, t:Date.now()});
  const thumb = S.preview? (()=>{ try{ const c=document.createElement('canvas'); const k=140/Math.max(S.preview.width,S.preview.height); c.width=Math.round(S.preview.width*k); c.height=Math.round(S.preview.height*k); c.getContext('2d').drawImage(S.preview,0,0,c.width,c.height); return c.toDataURL('image/jpeg',0.6); }catch(e){ return null; } })() : null;
  await updateRecent({size:f.size, thumb, hasFile:true});
  // 古いファイル本体を整理（最大12件・合計800MB）
  const r=await idbGet('session','recent'); if (!r) return; let total=0, n=0;
  for (const e of r.list){ if (!e.hasFile) continue; n++; total+=e.size||0; if (e.key!==key && (n>12 || total>800e6)){ await idbDel('files', e.key); e.hasFile=false; } }
  await idbPut('session', r);
}

function sumOf(st){ let m=0,a=0; const p=new Set(); for (const k in st.meas){ m+=st.meas[k].length; if (st.meas[k].length) p.add(k); } for (const k in st.ann){ a+=st.ann[k].length; if (st.ann[k].length) p.add(k); } return {m,a,p:p.size}; }
async function snapshot(reason, minGap=0){
  if (!S.key) return; const json=JSON.stringify(stateObj()); const h=fnv(json)+':'+json.length;
  if (h===AS.lastSnapHash) return; if (minGap && Date.now()-AS.lastSnapAt<minGap) return;
  AS.lastSnapHash=h; AS.lastSnapAt=Date.now(); const key=S.key;
  await idbPut('snaps', {key, t:Date.now(), reason, state:json, sum:sumOf(S)});
  const all=(await idbSnaps(key))||[]; if (all.length>80){ all.sort((a,b)=>a.t-b.t); for (const s of all.slice(0, all.length-80)) await idbDel('snaps', s.id); }
}
function fmtWhen(t){ const d=new Date(t), now=new Date(); const hm=d.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'}); const diff=(now-d)/60000;
  const rel = diff<1? 'たった今' : diff<60? `${Math.floor(diff)}分前` : diff<1440? `${Math.floor(diff/60)}時間前` : `${Math.floor(diff/1440)}日前`;
  const day = d.toDateString()===now.toDateString()? '今日' : `${d.getMonth()+1}/${d.getDate()}`; return `${day} ${hm}<small>${rel}</small>`; }

// ---- 起動時：直前の作業を自動で再開 ----
async function tryResume(){
  const last=await idbGet('session','last'); if (!last || !last.key){ renderRecentCard(); return; }
  const rec=await idbGet('files', last.key); if (!rec || !rec.blob){ renderRecentCard(); return; }
  busy('前回の作業を復元中…'); await openFile(new File([rec.blob], rec.name, {type:rec.type}), {stored:true, resume:true});
}
async function restoreView(){
  const key=S.key; const v=await idbGet('session','view:'+key); const u=await idbGet('session','undo:'+key); if (key!==S.key) return null;
  if (u){ S.undo=u.undo||[]; S.redo=u.redo||[]; }
  if (!v) return null;
  if (v.page && v.page!==S.page && v.page<=S.nPages) await gotoPage(v.page, true);
  if (v.zoom){ S.zoom=v.zoom; S.px=v.px+((S.cw-(v.cw||S.cw))/2); S.py=v.py+((S.ch-(v.ch||S.ch))/2); viewChanged(); }
  if (v.mode && v.mode!==S.mode) setMode(v.mode);
  if (v.tool && v.tool!==S.tool) setTool(v.tool);
  if (v.draft && v.draft.pts && v.draft.pts.length && S.tool===v.draft.kind){ S.draft=v.draft; drawOv(); }
  return v;
}

const CIRC = n => n>=1&&n<=20? String.fromCharCode(0x245F+n) : n<=35? String.fromCharCode(0x3250+n-20) : n<=50? String.fromCharCode(0x32B0+n-35) : `(${n})`;
function lineMeasAll(){ const out=[]; for (const pg of Object.keys(S.meas).map(Number).sort((a,b)=>a-b)) for (const m of S.meas[pg]||[]) if ((m.kind==='dist'||m.kind==='poly') && !m.draft && m.pts && m.pts.length>=2){ if (m.page==null) m.page=pg; out.push(m); } return out; }
const wallList = () => lineMeasAll().filter(wallOk);
function wallNoMap(){ const mp=new Map(); let i=0; for (const m of wallList()) mp.set(m.id, ++i); return mp; }
const wnoTxt = m => { const n=(S._wno||wallNoMap()).get(m.id); return n? CIRC(n)+' ' : ''; };
function drawWallNo(c, m, col){
  const n=(S._wno||wallNoMap()).get(m.id); if (!n) return; const P=pathPts(m); if (P.length<2) return;
  const tl=P.reduce((acc,p,i)=>i?acc+d2(P[i-1],p):0,0); const q=pointAt(P,tl/2); const a=w2s(q), b=w2s({x:q.x+q.ux,y:q.y+q.uy}); const L=Math.hypot(b.x-a.x,b.y-a.y)||1; let nx=-(b.y-a.y)/L, ny=(b.x-a.x)/L; if (ny<0||(Math.abs(ny)<1e-3&&nx<0)){ nx=-nx; ny=-ny; }
  const x=a.x+nx*18, y=a.y+ny*18; const t=String(n);
  c.save(); c.beginPath(); c.arc(x,y,t.length>1?11:10,0,TAU); c.fillStyle='#fff'; c.fill(); c.lineWidth=2; c.strokeStyle=col; c.stroke();
  c.fillStyle=col; c.font=`700 ${t.length>2?9:t.length>1?11:12}px `+FONT_STACK; c.textAlign='center'; c.textBaseline='middle'; c.fillText(t,x,y+0.5); c.restore();
}

function wallRow(m){

  if (!wallOk(m)) return {m, L, ok:false};

  return {m, c, L:c.Ltot, ok:true, H:c.H, gross:c.area, op:c.opArea, nop:c.ops.length, net:c.net, sides, both:c.net*sides, sheets:c.layers.reduce((a,l)=>a+c.boards[l].sheets,0)};

function boardTotals(rows){
  const t=new Map();
  for (const r of rows) if (r.ok) for (const l of r.c.layers){ const L=r.c.boards[l]; const key=`${L.board.n}｜${L.bw}×${L.bl}`; const o=t.get(key)||{name:L.board.n, size:`${L.bw}×${L.bl}`, sheets:0, used:0, walls:new Set()}; o.sheets+=L.sheets; o.used+=L.used; o.walls.add(r.m.id); t.set(key,o); }
