<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="図面計測">
<meta name="theme-color" content="#14171c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>図面計測 — ログイン</title>
<style>
:root{--bg:#14171c;--panel:#1b1f26;--line:#2e3542;--text:#e6e9ef;--muted:#9aa3b2;--accent:#4da3ff;--bad:#ff9a9a;--ok:#8fe0a0}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--text);font:16px/1.7 "Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:20px 16px}
main{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 20px}
h1{font-size:20px;margin:0 0 4px;display:flex;align-items:center;gap:10px}
h1 img{width:32px;height:32px;border-radius:7px}
p{margin:8px 0}
.mu{color:var(--muted);font-size:14px}
label{display:block;margin-top:12px;font-size:14px;color:var(--muted)}
input{width:100%;margin-top:4px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:11px 12px;font:inherit}
button{width:100%;min-height:46px;margin-top:14px;border-radius:8px;border:1px solid var(--line);background:#222731;color:var(--text);font:inherit;font-weight:700;cursor:pointer}
button.pri{background:var(--accent);border-color:var(--accent);color:#06121f}
button.ln{background:none;border:none;color:var(--accent);font-weight:400;min-height:38px;margin-top:4px;padding:4px}
button:disabled{opacity:.5}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;margin-top:18px}
.or::before,.or::after{content:"";flex:1;border-top:1px solid var(--line)}
#msg{min-height:1.2em;margin-top:10px;white-space:pre-wrap;font-size:14px}
#msg.bad{color:var(--bad)} #msg.ok{color:var(--ok)}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1><img src="icon-192.png" alt="">図面計測ツール</h1>
  <section id="vWait"><p id="waitT">確認しています…</p></section>
  <section id="vLogin" hidden>
    <p class="mu">管理者が名簿に登録した人だけが使えます。</p>
    <button class="pri" id="bGoogle">Google でログイン</button>
    <div class="or">または メールアドレスで</div>
    <form id="fIn"><label>メールアドレス<input type="email" id="em" autocomplete="username" required></label>
      <label>パスワード<input type="password" id="pw" autocomplete="current-password" required></label>
      <button type="submit">ログイン</button></form>
    <button class="ln" id="toUp">はじめての方（登録）</button><button class="ln" id="bReset">パスワードを忘れたとき</button>
  </section>
  <section id="vUp" hidden>
    <p class="mu">Google アカウントが無い方の登録です。管理者に伝えたメールアドレスを使ってください。</p>
    <form id="fUp"><label>メールアドレス<input type="email" id="em2" autocomplete="username" required></label>
      <label>パスワード（8文字以上）<input type="password" id="pw2" autocomplete="new-password" minlength="8" required></label>
      <button class="pri" type="submit">登録して確認メールを受け取る</button></form>
    <button class="ln" id="toIn">ログインに戻る</button>
  </section>
  <section id="vVerify" hidden>
    <p><b id="vEm"></b> に確認メールを送りました。メールの中のリンクを開いてから、下のボタンを押してください。</p>
    <p class="mu">届かないときは、迷惑メールのフォルダも見てください。</p>
    <button class="pri" id="bChk">リンクを開いたので続ける</button><button id="bSend">確認メールをもう一度送る</button><button class="ln" data-out>別のアカウントにする</button>
  </section>
  <section id="vDeny" hidden>
    <p><b id="dEm"></b> は名簿に登録されていません。</p>
    <p class="mu">管理者に、このメールアドレスの登録を頼んでください。登録が済んだら「もう一度確かめる」を押します。</p>
    <button class="pri" id="bAgain">もう一度確かめる</button><button class="ln" data-out>別のアカウントにする</button>
  </section>
  <section id="vErr" hidden><p id="eT"></p><button class="pri" id="bRetry">もう一度試す</button><button class="ln" data-out>別のアカウントにする</button></section>
  <div id="msg" role="status"></div>
</main>
<script>/* 入口は firebaseapp.com にそろえる（ログインの受け取り先と同じ場所だと、iPad でも確実に戻れる。保存データも1か所になる） */
if (/\.web\.app$/.test(location.hostname)) location.replace('https://'+location.hostname.replace(/\.web\.app$/,'.firebaseapp.com')+'/');</script>
<script type="module" src="shell.js"></script>
</body>
</html>
