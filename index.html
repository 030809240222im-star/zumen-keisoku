    ...(sys&&sys.sides===2? [['両面計', m2(c.net*2)+' m²']] : []), ['スタッド', `${c.studs.length}本${c.st&&c.st.stud?`（${c.st.stud}／ランナー${c.st.runner}）`:''}`]];
  for (const [k,v] of kv){ const hl=/控除後/.test(k); if (hl) s+=`<rect x="${RX-4}" y="${y-14}" width="${RWi+8}" height="20" fill="#fff4d6"/>`; s+=tx(RX, y, k, 'fill="#666" font-size="12.5"')+tx(RX+RWi, y, v, `text-anchor="end" font-size="${String(v).length>30?11:12.5}" ${hl?'font-weight="bold"':''} fill="#111"`); y+=20; }
  y+=8; if (c.layers.length){ s+=tx(RX, y, 'ボード', 'font-weight="bold" font-size="13"'); y+=18;
    for (const l of c.layers){ const L=c.boards[l]; s+=tx(RX, y, `${l.replace(/^A/,'A面').replace(/^B/,'B面')} ${L.board.n.replace(/^タイガー/,'').replace(/ボード・?/,'')} ${L.bw}×${L.bl}`, 'font-size="12"')+tx(RX+RWi, y, `${L.orient==='v'?'縦':'横'} ${L.sheets}枚 ロス${(L.loss*100).toFixed(0)}%`, 'text-anchor="end" font-size="12"'); y+=17; } }
  if (c.ops.length){ y+=8; s+=tx(RX, y, '開口', 'font-weight="bold" font-size="13"'); y+=18;
    for (const o of c.ops.slice(0,10)){ s+=tx(RX, y, `${o.mark||'開口'}　位置 ${mm(o.s)}`, 'font-size="12"')+tx(RX+RWi, y, `${mm(o.e-o.s)}×${mm(+o.h)}${+o.sill?`　下端${mm(+o.sill)}`:''}`, 'text-anchor="end" font-size="12"'); y+=17; }
    if (c.ops.length>10){ s+=tx(RX, y, `ほか${c.ops.length-10}箇所`, 'font-size="11" fill="#777"'); y+=17; } }
  // 凡例
  const lg=[['#1f77d4', c.arr==='千鳥'?'スタッド（A面側）':'スタッド'], ...(c.arr==='千鳥'? [['#2ca02c','スタッド（B面側）']] : []), ['#333','端部・コーナー'], ['#d62728','開口補強'], ['#e3edf8','ボード（定尺）'], ['#fde6c8','ボード（切物）']];
  let ly=H-M-14-Math.ceil(lg.length/2)*18-22; s+=tx(RX, ly, '※A面＝壁の始点→終点を見て左側。破線は連続線の折点。', 'font-size="11" fill="#666"'); ly+=20;
  lg.forEach(([cc,t],i)=>{ const x=RX+(i%2)*(RWi/2), yy=ly+Math.floor(i/2)*18; s+=`<rect x="${x}" y="${yy-10}" width="14" height="11" fill="${cc}" stroke="#555" stroke-width=".4"/>`+tx(x+20, yy, t, 'font-size="11.5" fill="#333"'); });
  return s+'</svg>';
}
function openDevView(opt={}){
  let ws=wallList(); if (opt.ids && opt.ids.length){ const set=new Set(opt.ids); ws=ws.filter(m=>set.has(m.id)); }
  if (!ws.length){ toast('高さを設定した壁がありません。線分を選んで高さを入力してください（🧱 壁一括）'); return; }
  DV.ids=ws.map(m=>m.id); DV.back=!!opt.back; if (opt.startId) DV.i=Math.max(0,DV.ids.indexOf(opt.startId)); if (DV.i>=DV.ids.length) DV.i=0;
  const dlg=$('#dlg'); dlg.classList.add('wide');
  const wno=wallNoMap(); const byPg=new Map(); ws.forEach((m,i)=>{ (byPg.get(m.page)||byPg.set(m.page,[]).get(m.page)).push([m,i]); });
  dlg.innerHTML=`<h3>展開図（割付図） — ${ws.length}壁</h3>
   <div class="dvwrap"><div class="dvidx">${[...byPg].map(([pg,arr])=>`<div class="dvpg">P${pg}<small>${arr.length}壁</small></div>${arr.map(([m,i])=>`<button data-i="${i}"><b>${CIRC(wno.get(m.id))}</b><span>${esc(m.name)}<small>L ${(computeWall(m).Ltot/1000).toFixed(2)}m × H ${m.wall.h}</small></span></button>`).join('')}`).join('')}</div>
   <div class="dvmain"><div class="dvtop"><button class="mini" id="dvPrev">◀</button><span id="dvPos"></span><button class="mini" id="dvNext">▶</button><div class="segb" id="dvMode"></div><span style="flex:1"></span><button class="mini" id="dvMag" title="シートを拡大／全体表示">🔍 拡大</button><button class="mini" id="dvZoom" title="図面上でこの壁を表示">図面で見る</button><button class="mini" id="dvSvg">SVGをコピー</button><button class="mini pri" id="dvPdf">PDFで保存（全${ws.length}ページ）</button></div>
   <div id="dvSheet" class="dvsheet"></div></div></div>
   <div class="acts">${DV.back?'<button class="btn" id="dvBack">← 一括設定に戻る</button>':''}<button class="btn pri" id="bCancel">閉じる</button></div>`;
  const cur=()=>ws[DV.i];
  const render=()=>{ const m=cur(); const c=computeWall(m); const ch=layerChoices(c); if (!ch.some(x=>x[0]===DV.mode)) DV.mode='all';
    $('#dvMode').innerHTML=ch.map(([v,t])=>`<button data-v="${v}" class="${DV.mode===v?'on':''}">${t}</button>`).join('');
    $('#dvMode').querySelectorAll('button').forEach(b=>b.onclick=()=>{ DV.mode=b.dataset.v; render(); });
    $('#dvPos').textContent=`${CIRC(wno.get(m.id))}　${DV.i+1} / ${ws.length}`;
    $('#dvSheet').innerHTML=sheetSVG(m, wno.get(m.id), wallList().length, DV.mode);
    dlg.querySelectorAll('.dvidx button').forEach(b=>b.classList.toggle('on', +b.dataset.i===DV.i));
    const on=dlg.querySelector('.dvidx button.on'); if (on) on.scrollIntoView({block:'nearest'}); };
  const go=d=>{ DV.i=(DV.i+d+ws.length)%ws.length; render(); };
  $('#dvMag').onclick=()=>{ const z=$('#dvSheet').classList.toggle('zoomed'); $('#dvMag').textContent=z?'🔍 全体':'🔍 拡大'; };
  $('#dvPrev').onclick=()=>go(-1); $('#dvNext').onclick=()=>go(1);
  dlg.querySelectorAll('.dvidx button').forEach(b=>b.onclick=()=>{ DV.i=+b.dataset.i; render(); });
  dlg.onkeydown=e=>{ if (e.key==='ArrowRight'||e.key==='PageDown'){ go(1); e.preventDefault(); e.stopPropagation(); } if (e.key==='ArrowLeft'||e.key==='PageUp'){ go(-1); e.preventDefault(); e.stopPropagation(); } };
  let sx=null; $('#dvSheet').addEventListener('touchstart',e=>{ sx=e.touches.length===1? e.touches[0].clientX : null; },{passive:true});
  $('#dvSheet').addEventListener('touchend',e=>{ if (sx==null) return; const dx=e.changedTouches[0].clientX-sx; if (Math.abs(dx)>70) go(dx<0?1:-1); sx=null; });
  const closeDlg=()=>{ closeModal(); dlg.classList.remove('wide'); dlg.onkeydown=null; };
  $('#dvZoom').onclick=()=>{ const m=cur(); closeDlg(); const f=()=>{ S.sel=m.id; zoomTo(m); refreshList(); }; m.page!==S.page? gotoPage(m.page).then(f) : f(); };
  $('#dvSvg').onclick=async()=>{ const t=$('#dvSheet').innerHTML; try{ await navigator.clipboard.writeText(t); toast('SVGをコピーしました（Illustrator等に貼付可）'); }catch(e){ showText('SVG',t); } };
  $('#dvPdf').onclick=()=>exportDevPdf(ws, DV.mode, $('#dvPdf'));
  if ($('#dvBack')) $('#dvBack').onclick=()=>openWallBatch({keep:true});
  $('#bCancel').onclick=closeDlg;
  render(); $('#modal').classList.add('show'); dlg.tabIndex=-1; dlg.focus({preventScroll:true});
}
function svgToCanvas(svg, scale){ return new Promise((res,rej)=>{ const img=new Image(); const url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));
  img.onload=()=>{ const cv=document.createElement('canvas'); cv.width=Math.round(SHEET.W*scale); cv.height=Math.round(SHEET.H*scale); const x=cv.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,cv.width,cv.height); x.drawImage(img,0,0,cv.width,cv.height); URL.revokeObjectURL(url); res(cv); };
  img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('SVGの描画に失敗')); }; img.src=url; }); }
async function exportDevPdf(ws, mode, btn){
  btn && (btn.disabled=true); const wno=wallNoMap(); const total=wallList().length;
  try{ const PDFLib=await loadPdfLib(); const pdf=await PDFLib.PDFDocument.create(); pdf.setTitle(baseName()+' 展開図（割付図）');
    for (let i=0;i<ws.length;i++){ busy(`展開図PDFを作成中… ${i+1}/${ws.length}`); const m=ws[i];
      const cv=await svgToCanvas(sheetSVG(m, wno.get(m.id), total, mode), 2); const jpg=await toBlob(cv,'image/jpeg',0.92);
      const img=await pdf.embedJpg(await jpg.arrayBuffer()); const pg=pdf.addPage([1190.55, 841.89]); pg.drawImage(img,{x:0,y:0,width:1190.55,height:841.89}); await new Promise(r=>setTimeout(r,0)); }
    const bytes=await pdf.save(); busy(''); await saveFile(baseName()+'_展開図_割付図.pdf', new Blob([bytes],{type:'application/pdf'}));
  }catch(e){ console.error(e); busy(''); toast('PDF作成に失敗：'+(e.message||e)); }
  finally{ btn && (btn.disabled=false); }
}

function hdrScrollHint(el){ if (!el) return; const f=()=>{ const sl=el.scrollLeft, mx=el.scrollWidth-el.clientWidth; el.classList.toggle('more-l', sl>4); el.classList.toggle('more-r', mx-sl>4); }; el.addEventListener('scroll',f,{passive:true}); addEventListener('resize',f); setTimeout(f,50); setTimeout(f,800); }

// ---- 単独Webアプリ（PWA）：オフラインでも起動できるように Service Worker を登録 ----
if (STANDALONE && 'serviceWorker' in navigator && /^https?:$/.test(location.protocol) && document.querySelector('link[rel=manifest]')) {
  addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').then(reg=>{
    reg.addEventListener('updatefound', ()=>{ const w=reg.installing; w && w.addEventListener('statechange', ()=>{ if (w.state==='installed' && navigator.serviceWorker.controller) toast('新しいバージョンがあります。再読み込みすると更新されます'); }); });
  }).catch(()=>{}); });
}

// ---- Cloudflare Access で保護されたサイトのとき：ログイン中のメールとログアウトを表示 ----
if (STANDALONE && /^https?:$/.test(location.protocol)) {
  fetch('/cdn-cgi/access/get-identity', {credentials:'include'}).then(r=>r.ok? r.json() : null).then(j=>{
    if (!j || !j.email) return; const ft=$('#saveSt') && $('#saveSt').parentNode; if (!ft) return;
    const w=document.createElement('span'); w.id='who'; w.style.cssText='margin-left:10px;color:var(--muted);white-space:nowrap;cursor:pointer';
    w.title='クリックでログアウト'; w.textContent='👤 '+j.email; w.onclick=()=>{ if (confirm(j.email+' からログアウトしますか？')) location.href='/cdn-cgi/access/logout'; };
    ft.insertBefore(w, $('#saveSt').nextSibling);
  }).catch(()=>{});
}
